# Rules-replay lane: run the corpus-replay harness (`mrd rules replay`) over the
# committed synthetic corpus every night, upload the markdown report as an
# inspectable artifact, and GATE on the regression signals — a deliberately-dead
# rule stays dead, and the two live rules keep their exact fire counts. If a
# kernel or synthesis change makes the dead rule fire, or silences a live one,
# this lane goes red. It is timing-insensitive (correctness only), so hosted
# runners are fine — the same posture as ci.yml.
name: rules-replay

on:
  schedule:
    # 06:00 UTC nightly — the standing regression run.
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Also run on changes to the harness or its fixture, so a PR that breaks the
  # signal is caught before it lands (not only the next night).
  pull_request:
    paths:
      - "crates/mrd/**"
      - "crates/rules/**"
      - ".github/workflows/rules-replay.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the toolchain/cache/build steps. `cargo run -p mrd`
      # pulls mrd -> registry -> view -> duckdb (bundled), which compiles the
      # full DuckDB C++ amalgamation from source. On ubuntu-latest (~14 GB free)
      # that plus the rust-cache restore can exhaust the disk mid-build, same as
      # the ci lane. Dropping the preinstalled SDKs/toolchains + Docker images
      # frees ~20-25 GB.
      - name: reclaim disk (bundled libduckdb-sys needs headroom on ubuntu-latest)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: protoc (mrd's registry → transport-proto compiles meridian.proto)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: replay the synthetic corpus → markdown report
        run: |
          cargo run -q -p mrd -- rules replay \
            --snapshots crates/mrd/tests/replay-corpus/snapshots \
            --rules crates/mrd/tests/replay-corpus/rules \
            --out replay-report.md
          echo "----- replay-report.md -----"
          cat replay-report.md

      - name: gate — dead rule detected, live rules keep their fire counts
        run: |
          set -euo pipefail
          report=replay-report.md
          # The deliberately-dead rule must be reported under "Dead rules".
          awk '/## Dead rules/{f=1} /## Per-rule/{f=0} f' "$report" \
            | grep -q '`dead_priority`' \
            || { echo "REGRESSION: dead_priority is no longer detected as dead"; exit 1; }
          # Exactly one dead rule; two fired.
          grep -q '^dead_rules: 1$' "$report" || { echo "REGRESSION: dead-rule count changed"; exit 1; }
          grep -q '^fired_rules: 2$' "$report" || { echo "REGRESSION: fired-rule count changed"; exit 1; }
          # The live rules keep their exact fire counts (3 events each).
          grep -qF '| `live_status` | 3 | 3 | 0 |' "$report" \
            || { echo "REGRESSION: live_status fire count changed"; exit 1; }
          grep -qF '| `live_section` | 3 | 3 | 0 |' "$report" \
            || { echo "REGRESSION: live_section fire count changed"; exit 1; }
          echo "OK: dead rule detected, live fire counts intact"

      - name: upload the report artifact (inspectable per run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-replay-report
          path: replay-report.md
