# Nix delivery lane — builds the `sidecar` binary and pushes it to the ccc
# binary cache (ccc.cachix.org). osfiles pins this flake as a flake-input and
# substitutes the prebuilt store path from the cache — no build-in-prod, no
# vendoring. Mirrors the ccc-mdformat CI→cache→flake-input precedent verbatim.
#
# The cargo correctness lane lives in ci.yml (fmt/clippy/test/deny); this lane
# is delivery only — it proves the flake builds AND seeds the cache.
#
# AUDIT BOUNDARY (D2 security-F1): cachix PUSH is allowed on main, tags, and
# manual workflow_dispatch — the controlled delivery events. Branch (infra/**)
# and PR runs BUILD (flake-builds coverage) but push NOTHING, so a dev-branch
# push can neither seed nor poison ccc.cachix.org. ccc-statusd's release stays
# pull-only (--max-jobs 0) and ships the exact bytes pushed here. Action refs are
# SHA-pinned (a moved tag can't swap the action under a write token).
# Push to main always triggers this workflow (build + cache seed).
name: nix

on:
  push:
    branches: [main, "infra/**"]
    tags: ["v*", "sidecar-*"]
  pull_request:
  workflow_dispatch:

jobs:
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest    → x86_64-linux (fleet Linux hosts).
        # ubuntu-24.04-arm → aarch64-linux (first-class arm fleet hosts).
        # macos-latest     → aarch64-darwin (zmax, the running-proof host).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ccc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push on main / tags / workflow_dispatch only (see AUDIT BOUNDARY).
          skipPush: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
      - name: Build sidecar (dynamic)
        run: nix build .#sidecar -L
      # Fleet-portable STATIC musl linux binary — the installer/R2 delivery pulls
      # THIS for foreign-Debian hosts. Built on both linux arches (x86_64 +
      # aarch64); the flake exposes sidecar-static only for linux.
      - name: Build sidecar-static (musl, linux only)
        if: runner.os == 'Linux'
        run: nix build .#sidecar-static -L
      - name: Flake check
        run: nix flake check -L
