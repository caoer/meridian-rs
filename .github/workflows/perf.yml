# Public-repository performance CI on a standard (free) GitHub-hosted VM.
# The runner size, Rust version and measured CPU affinity are fixed. GitHub's
# physical CPU and OS image can change, so baseline and candidate Criterion
# measurements are made in the SAME job and the machine description is saved.
name: perf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Git revision to compare on this VM (manual runs only)"
        default: "HEAD^"
        required: false

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  PERF_CPUS: "0,1"

jobs:
  sweep:
    runs-on: ubuntu-24.04 # standard public runner: 4 vCPUs, 16 GB RAM
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The bundled DuckDB build and both Cargo profiles need more than the
      # stock free disk space. Same reclamation as the correctness workflow;
      # this removes optional SDKs from this disposable VM, never repo files.
      - name: reclaim build disk and disable swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost /usr/local/lib/node_modules
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache downloads only. Large target trees stay out of the account's
          # cache allowance, and measurements are produced in this VM.
          shared-key: perf-ubuntu24-rust1.97.1
          cache-targets: false
      - name: resolve baseline and record the measured environment
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || inputs.baseline || 'HEAD^' }}
        run: |
          mkdir -p target/perf-results
          # The first push of a branch can carry an all-zero 'before'.
          if [[ "$BASELINE_REF" =~ ^0+$ ]]; then BASELINE_REF=HEAD^; fi
          base=$(git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}")
          baseline_dir="$RUNNER_TEMP/meridian-perf-baseline"
          git worktree add --detach "$baseline_dir" "$base"
          printf 'PERF_BASELINE_DIR=%s\n' "$baseline_dir" >> "$GITHUB_ENV"
          printf 'PERF_BASELINE_TARGET=%s/meridian-perf-baseline-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/target\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          # Only generated measurement data is reset, not the build cache.
          rm -rf target/criterion target/bench-claims
          {
            printf 'candidate=%s\nbaseline=%s\ncpus=%s\n' "$(git rev-parse HEAD)" "$base" "$PERF_CPUS"
            printf 'image=%s version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            uname -a
            lscpu
            free -b
            rustc -Vv
            cargo -V
            cc --version
            taskset -c "$PERF_CPUS" sh -c 'printf "measured parallelism="; nproc'
          } | tee target/perf-results/environment.txt
      - name: install pinned benchmark comparison tool
        run: cargo install critcmp --version 0.1.8 --locked
      # Select the actual benchmark targets; the default also runs lib/bin
      # libtest harnesses, which do not understand Criterion's --save-baseline.
      # Separate target directories are required: Cargo can reuse a baseline
      # executable in another worktree when the candidate's files are older.
      - name: compile baseline benchmarks
        run: CARGO_TARGET_DIR="$PERF_BASELINE_TARGET" cargo bench --manifest-path "$PERF_BASELINE_DIR/Cargo.toml" --locked -p perfsuite --bench '*' --no-run
      - name: measure baseline
        run: |
          CARGO_TARGET_DIR="$PERF_BASELINE_TARGET" taskset -c "$PERF_CPUS" cargo bench --manifest-path "$PERF_BASELINE_DIR/Cargo.toml" --locked -p perfsuite --bench '*' -- --save-baseline base 2>&1 | tee target/perf-results/baseline.log
          critcmp --target-dir "$PERF_BASELINE_TARGET" --export base > target/perf-results/baseline.json
          cp -R "$PERF_BASELINE_TARGET/bench-claims" target/perf-results/baseline-claims
      - name: compile candidate benchmarks
        run: cargo bench --locked -p perfsuite --bench '*' --no-run
      - name: measure candidate on the same VM
        run: |
          taskset -c "$PERF_CPUS" cargo bench --locked -p perfsuite --bench '*' -- --save-baseline candidate 2>&1 | tee target/perf-results/candidate.log
          critcmp --export candidate > target/perf-results/candidate.json
      - name: compare and render claim verdicts
        run: |
          critcmp target/perf-results/baseline.json target/perf-results/candidate.json | tee target/perf-results/comparison.txt
          taskset -c "$PERF_CPUS" cargo run --locked --release -p perfsuite --bin bench-report -- --results target/perf-results/claims | tee target/perf-results/claim-verdicts.md
      - name: compile every performance gate before measuring
        run: tools/perf-tests.sh --no-run
      - name: run performance gates serially on the fixed CPU set
        run: taskset -c "$PERF_CPUS" tools/perf-tests.sh -- --nocapture --test-threads=1 2>&1 | tee target/perf-results/gates.log
      # Belt: reap any residual resident whose argv is exactly the mrd binary
      # this job built. Field-exact shape only — never pgrep -f (matches agent
      # prompts; misses live daemons). Census is the proof, not kill exits.
      - name: reap residual perf-lane daemons (census-proved)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${CARGO_TARGET_DIR:-target}"
          MRD="${TARGET}/debug/mrd"
          if [ ! -x "$MRD" ]; then
            echo "no debug mrd at $MRD — nothing of this job to reap"
            exit 0
          fi
          # Resolve to the same path ps will show (Cargo may write through a
          # symlink; exact string match needs the form the kernel records).
          MRD="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$MRD")"
          census_mine() {
            ps -eo pid=,args= | while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              pid="${line%%[[:space:]]*}"
              rest="${line#*[[:space:]]}"
              case "$rest" in
                "$MRD daemon"|"$MRD daemon "*) printf '%s\n' "$pid" ;;
              esac
            done
          }
          before=$(census_mine | wc -l | tr -d ' ')
          echo "reap: binary $MRD"
          echo "reap: mine before $before"
          for p in $(census_mine); do
            kill -TERM "$p" 2>/dev/null || true
            sleep 1
            if kill -0 "$p" 2>/dev/null; then kill -KILL "$p" 2>/dev/null || true; sleep 1; fi
            if kill -0 "$p" 2>/dev/null; then
              echo "reap: FAILED to reap $p" >&2
              exit 1
            fi
            echo "reap: reaped $p"
          done
          after=$(census_mine | wc -l | tr -d ' ')
          echo "reap: mine after $after"
          if [ "$after" -ne 0 ]; then
            echo "reap: FAILED — $after of this binary's daemons survived" >&2
            exit 1
          fi
          echo "reap: verified — every daemon from this binary is gone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ github.sha }}
          path: target/perf-results/
          if-no-files-found: error
          retention-days: 7
