# Perf lane: full criterion sweep + claim measurements on CONSISTENT hardware.
# Requires a self-hosted runner registered with labels [self-hosted, bench]
# (pinned fleet host) — wall-time baselines are only meaningful when the
# machine doesn't change under them. Until that runner exists this workflow
# simply queues; registering it is an infra-ops task, not a repo change.
#
# Baseline discipline (criterion + critcmp):
#   - every run saves baseline "run-<sha7>"
#   - comparison target defaults to "main"; promote a good run on the runner:
#       cargo bench -p perfsuite -- --load-baseline run-<sha7> --save-baseline main
#     (or re-run: cargo bench -p perfsuite -- --save-baseline main)
#   - results/ artifacts carry machine fingerprint + git sha in every JSON.
name: perf

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "critcmp baseline name to compare against"
        default: "main"
        required: false
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    runs-on: [self-hosted, bench]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: full sweep, saved as baseline run-<sha7>
        run: cargo bench -p perfsuite -- --save-baseline "run-${GITHUB_SHA:0:7}"
      - name: install critcmp
        run: command -v critcmp >/dev/null || cargo install critcmp --locked
      - name: compare against named baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.inputs.baseline || 'main' }}"
          RUN="run-${GITHUB_SHA:0:7}"
          # Only an absent baseline is non-fatal; a real critcmp failure (with
          # pipefail, no longer masked by tee) fails the job.
          if critcmp --baselines | grep -qx "$BASE"; then
            critcmp "$BASE" "$RUN" | tee critcmp.txt
          else
            echo "no baseline named '$BASE' yet — promote one (see header comment)" | tee critcmp.txt
          fi
      - name: claim verdicts + run report
        run: cargo run -p perfsuite --bin bench-report | tee claim-verdicts.md
      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: |
            critcmp.txt
            claim-verdicts.md
            crates/perfsuite/results/
      # The `mrd status` <1s wall-time budget (1000 ms, U3.6). It lived in the
      # correctness suite until an A/B interleave proved it was measuring machine
      # contention there — shipped main blew it 3/3 under load — so it moved to the
      # home this repo already named for wall-time. LAST step on purpose: the sweep
      # artifacts above upload first, so a broken budget arrives WITH the criterion
      # data that explains it. `--nocapture` prints the measured ms into the log.
      - name: status wall-time gate (1000 ms hard budget, pinned runner)
        run: cargo test -p mrd --features perf-walltime --test status_walltime -- --nocapture
      # The multi-root profile — the same verb with a POPULATED mount table, the
      # input the step above deliberately deletes and therefore cannot bound.
      # Gated on CPU, not wall: this runner is pinned but not exclusive, and the
      # W2 investigation measured a 0.01 s-CPU command taking 5.3 s of wall under
      # load. `--nocapture` prints the measured CPU (and the ungated wall) into
      # the log. Rationale and the red/green control: the test file's header.
      - name: status multi-root CPU gate (600 ms, populated mount table)
        run: cargo test -p mrd --features perf-walltime --test status_multiroot_cpu -- --nocapture
