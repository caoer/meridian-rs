# Perf lane (manual-only): full criterion sweep + claim measurements on
# CONSISTENT hardware. Requires a self-hosted runner registered with labels
# [self-hosted, bench] — wall-time baselines are only meaningful when the
# machine doesn't change under them. Without that runner a dispatched run
# simply queues; registering it is an infra task, not a repo change.
#
# Baseline discipline (criterion + critcmp):
#   - every run saves baseline "run-<sha7>"
#   - comparison target defaults to "main"; promote a good run on the runner:
#       cargo bench -p perfsuite -- --load-baseline run-<sha7> --save-baseline main
#     (or re-run: cargo bench -p perfsuite -- --save-baseline main)
#   - results/ artifacts carry machine fingerprint + git sha in every JSON.
name: perf

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "critcmp baseline name to compare against"
        default: "main"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    runs-on: [self-hosted, bench]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: full sweep, saved as baseline run-<sha7>
        run: cargo bench -p perfsuite -- --save-baseline "run-${GITHUB_SHA:0:7}"
      - name: install critcmp
        run: command -v critcmp >/dev/null || cargo install critcmp --locked
      - name: compare against named baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.inputs.baseline || 'main' }}"
          RUN="run-${GITHUB_SHA:0:7}"
          # Only an absent baseline is non-fatal; a real critcmp failure (with
          # pipefail, no longer masked by tee) fails the job.
          if critcmp --baselines | grep -qx "$BASE"; then
            critcmp "$BASE" "$RUN" | tee critcmp.txt
          else
            echo "no baseline named '$BASE' yet — promote one (see header comment)" | tee critcmp.txt
          fi
      - name: claim verdicts + run report
        run: cargo run -p perfsuite --bin bench-report | tee claim-verdicts.md
      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: |
            critcmp.txt
            claim-verdicts.md
            crates/perfsuite/results/
      # The `mrd status` <1s wall-time budget (1000 ms). It lived in the
      # correctness suite until an A/B interleave proved it was measuring machine
      # contention there — shipped main blew it 3/3 under load — so it moved to the
      # home this repo already named for wall-time. LAST step on purpose: the sweep
      # artifacts above upload first, so a broken budget arrives WITH the criterion
      # data that explains it. `--nocapture` prints the measured ms into the log.
      - name: status wall-time gate (1000 ms hard budget, pinned runner)
        run: cargo test -p mrd --features perf-walltime --test status_walltime -- --nocapture
      # The multi-root profile — the same verb with a POPULATED mount table, the
      # input the step above deliberately deletes and therefore cannot bound.
      # Gated on CPU, not wall: this runner is pinned but not exclusive, and a
      # 0.01 s-CPU command was measured taking 5.3 s of wall under load. `--nocapture` prints the measured CPU (and the ungated wall) into
      # the log. Rationale and the red/green control: the test file's header.
      - name: status multi-root CPU gate (600 ms, populated mount table)
        run: cargo test -p mrd --features perf-walltime --test status_multiroot_cpu -- --nocapture
      # Bash step-end reaping wall budget (5s). Lived in the correctness suite
      # until host-load suite runs blew it (15.03s recorded) while isolation stayed
      # green — same class as status_walltime, same relocation. `--nocapture`
      # prints the measured duration into the log. Correctness keeps the event
      # half (no post-step leak file) in run/tests/exec.rs.
      - name: exec background-reap wall-time gate (5s, pinned runner)
        run: cargo test -p run --features perf-walltime --test exec_walltime -- --nocapture
      # Harness teardown control: auto-spawn → pidfile reap → assert dead, two
      # cycles, census of this binary stays flat. The status/walk/check targets
      # above are pure-local and cannot prove the class; this one can. The
      # step after this reaps any residual by exact binary path (belt).
      - name: perf daemon teardown control (two-cycle census)
        run: cargo test -p mrd --features perf-walltime --test perf_daemon_teardown -- --nocapture
      # Belt: reap any residual resident whose argv is exactly the mrd binary
      # this job built. Field-exact shape only — never pgrep -f (matches agent
      # prompts; misses live daemons). Census is the proof, not kill exits.
      - name: reap residual perf-lane daemons (census-proved)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${CARGO_TARGET_DIR:-target}"
          MRD="${TARGET}/debug/mrd"
          if [ ! -x "$MRD" ]; then
            echo "no debug mrd at $MRD — nothing of this job to reap"
            exit 0
          fi
          # Resolve to the same path ps will show (Cargo may write through a
          # symlink; exact string match needs the form the kernel records).
          MRD="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$MRD")"
          census_mine() {
            ps -eo pid=,args= | while IFS= read -r line; do
              line="${line#"${line%%[![:space:]]*}"}"
              pid="${line%%[[:space:]]*}"
              rest="${line#*[[:space:]]}"
              case "$rest" in
                "$MRD daemon"|"$MRD daemon "*) printf '%s\n' "$pid" ;;
              esac
            done
          }
          before=$(census_mine | wc -l | tr -d ' ')
          echo "reap: binary $MRD"
          echo "reap: mine before $before"
          for p in $(census_mine); do
            kill -TERM "$p" 2>/dev/null || true
            sleep 1
            if kill -0 "$p" 2>/dev/null; then kill -KILL "$p" 2>/dev/null || true; sleep 1; fi
            if kill -0 "$p" 2>/dev/null; then
              echo "reap: FAILED to reap $p" >&2
              exit 1
            fi
            echo "reap: reaped $p"
          done
          after=$(census_mine | wc -l | tr -d ' ')
          echo "reap: mine after $after"
          if [ "$after" -ne 0 ]; then
            echo "reap: FAILED — $after of this binary's daemons survived" >&2
            exit 1
          fi
          echo "reap: verified — every daemon from this binary is gone"
