# PR lane: correctness + harness bit-rot, timing-insensitive — hosted runners
# are fine here. Wall-time numbers are NEVER gated in this lane (shared-runner
# noise); that's perf.yml's job on the pinned fleet runner.
name: ci

on:
  push:
    branches: [main, "candidate/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reclaim disk before the toolchain/cache/build steps. The `view` crate
      # pulls duckdb with the `bundled` feature, which compiles the full DuckDB
      # C++ amalgamation from source; combined with a full `cargo test
      # --workspace` target/ and the rust-cache restore this exhausts the
      # ~14 GB free on ubuntu-latest (No space left on device). Dropping the
      # preinstalled SDKs/toolchains frees ~17 GB (14 GB -> ~31 GB free).
      # Do NOT `docker image prune` here: the cargo-deny step runs as a Docker
      # action whose image is pre-built at job setup; pruning deletes it and
      # the later cargo-deny step fails with "pull access denied".
      - name: reclaim disk (bundled libduckdb-sys needs headroom on ubuntu-latest)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: protoc (transport-proto's prost-build compiles meridian.proto)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (workspace lint policy, escalated)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (all members incl. perfsuite harness)
        run: cargo test --workspace
      - name: cargo-deny (fork one-copy law, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: bench smoke (one iteration per target — catches harness bit-rot)
        run: cargo bench -p perfsuite -- --test
      - name: claim verdicts (renders the live claims table into the CI log)
        run: cargo run -p perfsuite --bin bench-report
