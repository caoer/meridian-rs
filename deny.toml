# cargo-deny policy. Run: cargo deny check
# The bans entry is the mechanical form of the [patch.crates-io] one-copy law.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # foldhash (via duckdb → hashlink → hashbrown, and starlark → allocative
    # → hashbrown); zlib/libpng-family permissive
    "Zlib",
]
# Per-crate scoped exceptions (strict default stays). All OSI-permissive;
# pre-existing on branch, surfaced during ws-foundation gating.
exceptions = [
    # via policy → starlark → debugserver-types → schemafy
    { crate = "Inflector", allow = ["BSD-2-Clause"] },
    # via model → blake3
    { crate = "arrayref", allow = ["BSD-2-Clause"] },
    # via policy → starlark (BSL-1.0 = Boost, not Business-Source)
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    # via policy → starlark → clipboard-win
    { crate = "error-code", allow = ["BSL-1.0"] },
    # via blake3/sha2 → digest
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    # duckdb `bundled` view-organ compiler: libduckdb-sys pulls a BUILD-ONLY
    # reqwest/rustls stack (non-optional build-dependency; never linked into the
    # shipped binary). All OSI-permissive / public-domain, scoped per-crate.
    { crate = "ring", allow = ["ISC"] }, # ring = "Apache-2.0 AND ISC" (Apache allowed globally)
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # The §6.4 event-feed watcher stack (registry → notify): notify is
    # CC0-1.0 (public-domain-equivalent); its Linux backend crates are ISC
    # (OSI-permissive, functionally MIT). Scoped per-crate, strict default
    # stays.
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "notify-types", allow = ["CC0-1.0"] },
    { crate = "inotify", allow = ["ISC"] },
    { crate = "inotify-sys", allow = ["ISC"] },
]

[advisories]
# Fetch the RustSec DB from our own forge mirror (pull-mirrored from
# github.com/rustsec/advisory-db, synced hourly), not from GitHub directly:
# CI clones it fresh per run, so the fetch must be LAN-cheap and must not
# depend on GitHub rate limits. The mirror is public — no credentials.
db-urls = ["https://git.0xdao.app/caoer115/advisory-db"]
# Unmaintained-only advisories, all transitive via policy → starlark 0.14.2
# (the pinned reference interpreter). Revisit at any starlark bump.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained; via starlark → pagable → postcard → heapless" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained; via starlark proc-macros" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; via starlark_map" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via starlark proc-macros" },
]

[bans]
# Benign transitive duplicates warn; the fork law is the hard gate below.
multiple-versions = "warn"
deny = [
    # ONE pulldown-cmark copy graph-wide (workspace root, axis B) — enforced.
    { crate = "pulldown-cmark", deny-multiple-versions = true },
]

[sources]
unknown-git = "deny"
allow-git = [
    # The sanctioned fork consumed via [patch.crates-io] (branch `obsidian`).
    "https://github.com/caoer/pulldown-cmark",
]
