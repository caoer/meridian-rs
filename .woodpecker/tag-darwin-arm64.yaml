# TAG lane — darwin/arm64, CROSS-COMPILED on the linux/amd64 runner. The mac
# half of the release: same commit, same pin vocabulary, same registry probe.
#
# Law: docs/release.md §5.4 (what the tag publishes). Keying, the 409
# first-writer property, and the no-`latest` rule are ruled there, not here.
#
# Same shape as `tag-linux-arm64.yaml` — probe the registry, attest the tree,
# build, check the artifact, publish. What makes a mac binary on linux:
#   - the toolchain: `cargo zigbuild` with a PINNED zig. zig compiles the
#     vendored C++ DuckDB (`libduckdb-sys` `bundled`) for aarch64-macos with its
#     own libc++ and darwin libc headers, and its Mach-O linker ad-hoc signs the
#     output, which arm64 macOS requires before it will exec a binary.
#   - the link stubs: mrd links CoreFoundation and CoreServices (notify's
#     FSEvents backend), which only a macOS SDK carries, as `.tbd` text stubs.
#     The SDK is Apple's and is NOT redistributable, so it is never in this
#     repo or the (publicly readable) package registry: it is a tarball in the
#     runner's own `/ci-cache`, checked against the digest pinned below on every
#     run. Making it: docs/release.md §5.4, "The darwin SDK tarball".
#   - NO `SDKROOT`: cargo-zigbuild turns it into `--sysroot`, and zig prefixes
#     EVERY absolute `-L` with the sysroot (no ld64-style fallback), so the
#     link loses the build's own out-dirs. The stubs reach the linker by path
#     through the target RUSTFLAGS instead.
#   - zig >= 0.16 is the floor: since SDK 26 Apple ships CoreFoundation stubs for
#     `arm64e` alone, and only from 0.16 does zig accept them for an `arm64`
#     link, as Apple's ld64 does.
#   - the runner cannot exec a Mach-O, so the artifact check reads its BYTES:
#     the Mach-O arm64 header and the stamp string. Executing it is the darwin
#     smoke a mac does after publish (docs/release.md §5.4).
# No sccache and no mold, as in the linux-arm64 lane. The cold build is a DuckDB
# compile, ~15–25 min on this runner.
when:
  # RELEASE-SHAPED TAGS ONLY (docs/release.md §5.2) — the repo's component and
  # snapshot tags must not publish a release.
  - event: tag
    ref: refs/tags/v*
  # manual keeps the lane provable and re-runnable without minting a tag; it
  # publishes under the commit key like every other route.
  - event: manual

# THE GATE — not `optional: true`; ci.yaml's header and tag-linux-amd64.yaml
# carry why.
depends_on:
  - ci

# Pinned to the host whose /ci-cache holds the SDK tarball.
labels:
  hostname: workstation-nyc-2

clone:
  - name: git
    image: docker.io/woodpeckerci/plugin-git:2.9.2
    environment:
      PLUGIN_DEPTH: "0"
      PLUGIN_TAGS: "true"
      CI_NETRC_MACHINE: git.0xdao.app
      CI_NETRC_USERNAME: caoer115
      CI_NETRC_PASSWORD:
        from_secret: forgejo_clone_token

steps:
  - name: publish mrd (darwin-arm64, keyed by commit)
    image: "meridian-ci:2026-08-10"
    pull: false
    environment:
      CARGO_HOME: /ci-cache/meridian-rs/cargo
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # zig 0.16 targets macOS 13 at the lowest; the binary records minos 13.0.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # THE PINS. A change to any of them is a change to what this lane
      # publishes: bump deliberately, and rebuild the SDK tarball per §5.4.
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_ZIGBUILD_VERSION: "0.23.4"
      MACOS_SDK_TARBALL: /ci-cache/macos-sdk/MacOSX27.0-tbd.tar.gz
      MACOS_SDK_SHA256: cbdb898c4e8df387e33a858cab70dde37726f187bbf1083c73e45b3ad55ba313
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      # ASK THE REGISTRY FIRST — the .sha256 sidecar answers "published?" and
      # "which digest?" in one request (tag-linux-amd64.yaml has the reasoning).
      - |
        set -eu
        git config --global --add safe.directory "$${CI_WORKSPACE}"
        rev="$(git rev-parse "$${CI_COMMIT_SHA}^{commit}")"
        echo "$${rev}" > /tmp/rev
        echo "publishing under commit $${rev} (CI sha: $${CI_COMMIT_SHA})"
        base="https://git.0xdao.app/api/packages/caoer115/generic/mrd/$${rev}"
        code="$(curl -s -o /tmp/have.sha256 -w '%{http_code}' \
          -H "Authorization: token $${FORGEJO_TOKEN}" "$${base}/mrd-darwin-arm64.sha256")"
        if [ "$${code}" = "200" ]; then
          echo "already published for $${rev} — the FIRST bytes stay authoritative (append-only)"
          echo "SKIP_BUILD=1" > /tmp/lane.env
        else
          echo "not published for $${rev} (HTTP $${code}) — building"
          echo "SKIP_BUILD=0" > /tmp/lane.env
        fi
      # The cross toolchain and the SDK stubs, each checked against its pin.
      # zig and cargo-zigbuild are cached in /ci-cache by version; the SDK is
      # unpacked fresh into /tmp each run.
      - |
        set -eu
        . /tmp/lane.env
        [ "$${SKIP_BUILD}" = "0" ] || exit 0
        if [ ! -f "$${MACOS_SDK_TARBALL}" ]; then
          echo "no SDK tarball at $${MACOS_SDK_TARBALL} — make it per docs/release.md §5.4 (The darwin SDK tarball)"
          exit 1
        fi
        echo "$${MACOS_SDK_SHA256}  $${MACOS_SDK_TARBALL}" | sha256sum -c -
        mkdir -p /tmp/sdk && tar -C /tmp/sdk -xzf "$${MACOS_SDK_TARBALL}"
        test -f /tmp/sdk/MacOSX.sdk/System/Library/Frameworks/CoreServices.framework/CoreServices.tbd
        zdir="/ci-cache/zig/$${ZIG_VERSION}"
        if [ ! -x "$${zdir}/zig" ]; then
          curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/$${ZIG_VERSION}/zig-x86_64-linux-$${ZIG_VERSION}.tar.xz"
          echo "$${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$${zdir}.part" && tar -C "$${zdir}.part" --strip-components=1 -xJf /tmp/zig.tar.xz
          rm -rf "$${zdir}" && mv "$${zdir}.part" "$${zdir}"
        fi
        zbin="/ci-cache/meridian-rs/cargo-zigbuild-$${CARGO_ZIGBUILD_VERSION}"
        [ -x "$${zbin}/bin/cargo-zigbuild" ] || \
          cargo install --locked --root "$${zbin}" "cargo-zigbuild@$${CARGO_ZIGBUILD_VERSION}"
        rustup target add aarch64-apple-darwin
      # Attest the tree, tri-state, flag for flag with the engine's own probe
      # — the amd64 lane's comment block is the law here too.
      - |
        set -eu
        . /tmp/lane.env
        [ "$${SKIP_BUILD}" = "0" ] || exit 0
        rev="$(cat /tmp/rev)"
        if ! porcelain="$(git --no-optional-locks status --porcelain --untracked-files=no)"; then
          echo "the tree probe FAILED — cannot attest, and 'could not tell' is not 'clean'"
          exit 1
        fi
        if [ -n "$porcelain" ]; then
          echo "tracked content diverges from $${rev} — refusing to publish a RELEASE no sha can recover"
          printf '%s\n' "$porcelain"
          exit 1
        fi
        if ! head="$(git rev-parse HEAD)"; then
          echo "rev-parse FAILED — cannot attest which tree was built"
          exit 1
        fi
        if [ "$head" != "$${rev}" ]; then
          echo "HEAD is $head, not $${rev} — the probe answered for a tree the stamp does not name; refusing"
          exit 1
        fi
        echo "MRD_BUILD_SHA=$${rev}" > /tmp/stamp.env
        cat /tmp/stamp.env
        export PATH="/ci-cache/zig/$${ZIG_VERSION}:/ci-cache/meridian-rs/cargo-zigbuild-$${CARGO_ZIGBUILD_VERSION}/bin:$${PATH}"
        unset SDKROOT
        export CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS="-L framework=/tmp/sdk/MacOSX.sdk/System/Library/Frameworks -L native=/tmp/sdk/MacOSX.sdk/usr/lib"
        zig version
        env $(cat /tmp/stamp.env) cargo zigbuild -q --locked --release -p mrd --target aarch64-apple-darwin
      # Check the artifact — by its bytes, because this runner cannot exec it:
      # a Mach-O 64 arm64 header (magic cffaedfe, cputype 0100000c,
      # little-endian), and the stamp string naming exactly $rev, never
      # `unknown` or `-dirty`.
      - |
        set -eu
        . /tmp/lane.env
        [ "$${SKIP_BUILD}" = "0" ] || exit 0
        rev="$(cat /tmp/rev)"
        bin=target/aarch64-apple-darwin/release/mrd
        hdr="$(head -c 8 "$${bin}" | od -An -tx1 | tr -d ' \n')"
        echo "header: $${hdr}"
        [ "$${hdr}" = "cffaedfe0c000001" ] || { echo "not a Mach-O arm64 executable — refusing to publish it as one"; exit 1; }
        grep -aq "$${rev}" "$${bin}" || { echo "the binary does not carry $${rev} — the pin would lie about what it is"; exit 1; }
        if grep -aq "$${rev}-dirty" "$${bin}"; then echo "the binary is stamped -dirty — refusing"; exit 1; fi
        echo "stamp $${rev} present"
      - |
        set -eu
        . /tmp/lane.env
        rev="$(cat /tmp/rev)"
        base="https://git.0xdao.app/api/packages/caoer115/generic/mrd/$${rev}"
        if [ "$${SKIP_BUILD}" = "0" ]; then
          bin=target/aarch64-apple-darwin/release/mrd
          sha="$(sha256sum "$${bin}" | cut -d' ' -f1)"
          echo "$${sha}  mrd-darwin-arm64" > /tmp/mrd-darwin-arm64.sha256
          put() {
            for delay in 0 15 45; do
              [ "$delay" = 0 ] || sleep "$delay"
              code="$(curl -s -o /tmp/put.out -w '%{http_code}' -X PUT \
                -H "Authorization: token $${FORGEJO_TOKEN}" \
                --upload-file "$$1" "$${base}/$$2")"
              case "$${code}" in
                201) echo "published $$2"; return 0 ;;
                409) echo "$$2 already published for this commit — keeping the FIRST bytes (append-only)"; return 0 ;;
              esac
              echo "publish $$2: HTTP $${code} — retrying"
              cat /tmp/put.out || true
            done
            echo "publish $$2 failed after 3 attempts: HTTP $${code}"
            exit 1
          }
          put "$${bin}" mrd-darwin-arm64
          put /tmp/mrd-darwin-arm64.sha256 mrd-darwin-arm64.sha256
        fi
        echo ''
        echo 'pin for downstream .mrd-pin (darwin-arm64):'
        echo "  MRD_COMMIT=$${rev}"
        echo "  MRD_SHA256=$$(curl -fsSL -H "Authorization: token $${FORGEJO_TOKEN}" "$${base}/mrd-darwin-arm64.sha256" | cut -d' ' -f1)"
