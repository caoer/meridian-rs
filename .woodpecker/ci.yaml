# Correctness lane on the fleet runner. Steps are named so a red pipeline
# names its own defect instead of saying "test failed".
#
# DAG, NOT SERIAL: every VERDICT lane declares `depends_on: []`, so all lanes
# start together and each always produces its own verdict. The previous revision
# ordered tests first because a serial pipeline aborts the remaining steps on
# the first failure — a lint nit converted the test verdict into SKIPPED. The
# DAG removes that coupling structurally: no verdict can mask another, and a
# new lane cannot reintroduce the problem by being inserted in the wrong slot.
#
# THE ONE EXCEPTION, and it is not a verdict lane: `publish mrd` (bottom of this
# file) declares a dependency on ALL SIX verdict lanes, because it produces the
# artifact downstream repos pin rather than a verdict of its own. ADDING A LANE
# MEANS ADDING IT TO THAT LIST TOO — copy `depends_on: []` for the lane itself,
# then extend the publish step's list, or the artifact ships on a tree your new
# lane failed.
#
# What makes the parallelism safe:
#   - CARGO_HOME shares ONLY the registry/git cache (host /var/cache/ci via
#     the agent's WOODPECKER_BACKEND_DOCKER_VOLUMES) — cargo locks it
#     correctly under concurrent pipelines. A shared target dir would race:
#     a parallel build of another commit deletes test binaries between build
#     and run, so target dirs stay inside the per-pipeline workspace.
#   - sccache shards its disk cache PER LANE under the same host mount: a
#     disk cache is single-server, and the lanes run concurrently. The shard
#     survives pipelines — that cross-pipeline reuse is the point — and a
#     rare same-lane overlap of two pipelines degrades to a cache miss,
#     never a wrong artifact (entries are content-addressed and decoded on
#     read). sccache wraps COMPILES only; linking is mold's job (RUSTFLAGS).
#   - The workspace is SHARED: any lane that writes a TRACKED file races
#     every lane that reads the tree (build_identity asserts tree state —
#     pipeline #25). Lanes may write only untracked paths: target dirs,
#     /tmp, the /ci-cache mount.
#   - The deny lane keeps NO shared state: cargo-deny's advisory DB is a git
#     working copy, which a killed run leaves half-written and unrepairable by
#     any lock, so that lane runs on a container-local CARGO_HOME and clones
#     the DB fresh from our forge mirror each run (see the lane).
#   - Root lanes share the workspace ./target; cargo's build-dir flock
#     serializes their compiles (flock works across containers on one host).
#   - The test lane runs as a non-root user in its own ./target-ci, so
#     root-owned artifacts and the ci user's builds never collide.
#
# Event filter is workflow-level: every step inherits it, so a new step cannot
# be added without one. A step may NARROW it with its own `when:` — `publish mrd`
# does, and is the only step here that does — so this block is the ceiling on
# what runs, not the answer to "on which events does step X run".
when:
  - event: [push, pull_request, manual]
  # NOT `tag`: the v* tag lanes (`tag-linux-amd64.yaml`, `tag-darwin-arm64.yaml`)
  # are still UNGATED — they publish a release with no test verdict anywhere in
  # the pipeline. Gating them needs this workflow to run on tags so they have a
  # verdict to depend on, and that was withdrawn from this change on evidence:
  # a tag workflow that starts ~18 min after `ci` (pipeline 1204) failed its
  # CLONE with `could not read Username`, on both a docker and a local agent,
  # while the same workflows cloned fine when they started beside `ci`
  # (pipeline 845). Gating the tag lanes without settling that would trade
  # "publishes ahead of the verdict" for "cannot publish at all".
  # Follow-up card: 22-18/tasks/meridian-rs-tag-lanes-not-gated.

labels:
  hostname: workstation-nyc-2

variables:
  # Local image, built from Dockerfile.ci on the runner and referenced with
  # pull: false on every step. It bakes the old per-lane setup (rustfmt/clippy
  # components, python3-yaml, mold, cargo-deny, sccache) so pipelines start at
  # the verdict. The toolchain still tracks stable — parity with the GH lane's
  # dtolnay/rust-toolchain@stable — but moves by image rebuild + tag bump
  # here, not by a floating pull at CI time.
  - &rust_image "meridian-ci:2026-08-10"
  - &cargo_home /ci-cache/meridian-rs/cargo
  # Cap per-lane build parallelism. cargo's jobserver is shared with the cc
  # crate, so this also bounds the parallel cc1plus instances compiling the
  # bundled DuckDB amalgamation (~1.5 GB each). Unbounded on the 30-core /
  # 58 GB runner, two lanes building DuckDB concurrently OOM-killed cc1plus
  # (pipeline #20: "error: Killed signal terminated program cc1plus").
  - &build_jobs "8"
  # Cap per-lane sccache shard. The bundled-DuckDB objects dominate a warm
  # shard; 30G is ~10x that. If --show-stats shows evictions, raise the test
  # shard first — it holds the most profile variants.
  - &sccache_size "30G"

steps:
  # The suite.
  #
  # The frontmatter tests cross-validate the engine's YAML against PyYAML
  # (python3-yaml is in the image). The fs permission tests build
  # "unreadable" fixtures with chmod, and root bypasses permission bits — so
  # run cargo as a created non-root user. setpriv preserves PATH and CARGO_*
  # (no PAM, no env reset). The mount tests also precondition an existing XDG
  # base dir ($HOME/.config).
  #
  # CARGO_PROFILE_TEST_DEBUG=0: mrd and every mrd test binary statically
  # embed bundled libduckdb; duplicated debug info is the bulk of the target
  # dir (it SIGBUS'd rust-lld on the GH runners). Env var, NOT a Cargo.toml
  # [profile] edit — local dev builds keep full debug.
  - name: test (cargo test --workspace --locked)
    depends_on: []
    image: *rust_image
    pull: false
    environment:
      CARGO_HOME: *cargo_home
      CARGO_TARGET_DIR: target-ci
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: *build_jobs
      # Cargo strips color on a non-TTY unless told otherwise; Woodpecker's
      # log viewer renders ANSI. Errors arrive already highlighted.
      CARGO_TERM_COLOR: always
      # Fresh target dir per pipeline: incremental state would be pure write
      # overhead. sccache (below) is the cross-pipeline reuse mechanism.
      CARGO_INCREMENTAL: "0"
      # RUSTC_WRAPPER caches rustc; the CC/CXX wrappers cache the
      # bundled-DuckDB cc1plus compiles (the cc crate splits wrapper+command).
      # Per-lane SCCACHE_DIR shard — see the header.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /ci-cache/sccache/test
      SCCACHE_CACHE_SIZE: *sccache_size
      CC: "sccache cc"
      CXX: "sccache c++"
      # mold over GNU ld: this lane links many binaries that statically embed
      # libduckdb. mold is in the image; bookworm's gcc 12 accepts
      # -fuse-ld=mold.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    commands:
      - useradd -m ci
      - mkdir -p /home/ci/.config target-ci "$CARGO_HOME" "$SCCACHE_DIR"
      # chown the sources but NOT ./target — the root lanes write it
      # concurrently, and a recursive chown over a churning tree fails on
      # paths that vanish mid-walk.
      - find . -mindepth 1 -maxdepth 1 ! -name 'target*' -exec chown -R ci:ci {} +
      - chown ci:ci . target-ci
      # The same race, one level down: the SHARED cargo/sccache caches are
      # written by the other lanes while this walk runs, and cargo's transient
      # .global-cache-journal is created and removed mid-walk — the walk then
      # dies on ENOENT. Sha-independent flake: one immutable tree lost/won/lost
      # across three runs. Owning a file that no longer exists is a no-op, so
      # tolerate exactly ENOENT and keep failing on every other chown error.
      - |
        errs=$(chown -R ci:ci "$CARGO_HOME" "$SCCACHE_DIR" /home/ci 2>&1 >/dev/null || true)
        real=$(printf '%s' "$errs" | grep -v 'No such file or directory' || true)
        if [ -n "$real" ]; then printf '%s\n' "$real"; exit 1; fi
        if [ -n "$errs" ]; then echo "chown: tolerated cache entries that vanished mid-walk"; fi
      # Compile the test binaries in their OWN fold, so the suite's fold holds
      # verdicts and nothing else. On green this fold is near-empty; on a
      # compile error the diagnostics still print here, and the suite fold
      # below is then obviously absent rather than buried.
      - setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci cargo test --workspace --locked --no-run -q
      # --no-fail-fast: one failing test binary must not trade away the other
      # binaries' verdicts (pipeline #25 lost ~80% of the suite's evidence to
      # a single red binary). Inner bash for pipefail — tee must not mask
      # cargo's exit code; the outer step shell stays POSIX.
      #
      # The evidence count runs in the SAME command as the suite: a failing
      # command aborts a step's remaining commands, so a separate gate line
      # can never fire on the zero-evidence red it exists for (OOM-killed
      # compiler: red exit, no test output). The count prints on every path —
      # a silently shrinking suite is the failure mode nobody watches for —
      # and a green exit with zero evidence lines is a broken harness, so it
      # fails the step.
      #
      # -q does BOTH jobs: it suppresses cargo's per-crate `Fresh`/`Running`
      # restamp AND forwards --quiet to libtest (one character per test).
      # Writing `-q -- --quiet` as well is what pipeline #30 died of —
      # "error: Option 'quiet' given more than once", every binary red, zero
      # evidence lines. Do not add it back. Neither flag touches the
      # evidence: `^test result` lines print in both modes, so the gate below
      # counts exactly what it counted before, and a FAILING test still prints
      # its name, its panic, and its captured output in full. The trade
      # accepted (ZT, 2026-08-10): suite.log keeps binary-level counts, not the
      # name of every passing test.
      - |
        set +e
        setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci bash -o pipefail -c 'cargo test --workspace --locked --no-fail-fast -q 2>&1 | tee target-ci/suite.log'
        rc=$?
        set -e
        lines=$(grep -c '^test result' target-ci/suite.log || true)
        echo "evidence lines: $lines"
        if [ "$rc" -ne 0 ]; then
          [ "$lines" -gt 0 ] || echo "NO MEASUREMENT — this red is not a test verdict; the build died before any test ran"
          exit "$rc"
        fi
        test "$lines" -gt 0
      # Hit rates in the log make cache regressions diagnosable; the sccache
      # server is ci's, so ask it as ci. Stats must not gate the suite's
      # verdict, but their absence must be loud — a wedged shard degrades to
      # silent 0% hits, not to an error.
      - setpriv --reuid=ci --regid=ci --init-groups env HOME=/home/ci sccache --show-stats || echo "WARNING sccache stats unavailable — caching may be inoperative"

  - name: fmt (cargo fmt --all --check)
    depends_on: []
    image: *rust_image
    pull: false
    commands:
      - cargo fmt --all --check

  - name: clippy (workspace lint policy, escalated)
    depends_on: []
    image: *rust_image
    pull: false
    environment:
      CARGO_HOME: *cargo_home
      CARGO_BUILD_JOBS: *build_jobs
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /ci-cache/sccache/clippy
      SCCACHE_CACHE_SIZE: *sccache_size
      CC: "sccache cc"
      CXX: "sccache c++"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always
    commands:
      # -q: a green lane prints NOTHING, so an empty fold is the verdict and
      # costs no scan. A red lane still prints every diagnostic.
      - cargo clippy -q --workspace --all-targets --locked -- -D warnings
      - sccache --show-stats || echo "WARNING sccache stats unavailable — caching may be inoperative"

  # The perf lane's targets are feature-gated, so --all-targets above skips
  # them. Lint them here so they cannot bit-rot: this COMPILES the asserts, it
  # never runs them. The list is DERIVED, not typed — a `required-features =
  # ["perf-walltime"]` target added tomorrow is picked up automatically, which
  # the hand-maintained list in .github/workflows/ci.yml was not (it had
  # already drifted: links_multiroot_cpu and sql_multiroot_cpu were missing).
  - name: clippy the perf-gated targets (compiled here, never run)
    depends_on: []
    image: *rust_image
    pull: false
    environment:
      CARGO_HOME: *cargo_home
      CARGO_BUILD_JOBS: *build_jobs
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /ci-cache/sccache/clippy-perf
      SCCACHE_CACHE_SIZE: *sccache_size
      CC: "sccache cc"
      CXX: "sccache c++"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always
    commands:
      - |
        set -eu
        found=0
        for manifest in crates/*/Cargo.toml; do
          pkg=$(basename "$(dirname "$manifest")")
          grep -q '^perf-walltime = ' "$manifest" || continue
          # every [[test]] block whose required-features names perf-walltime
          targets=$(awk '
            /^\[\[test\]\]/      { name=""; next }
            /^name *= *"/        { gsub(/^name *= *"|"$/,""); name=$0 }
            /perf-walltime/ && /required-features/ && name { print name; name="" }
          ' "$manifest")
          for t in $targets; do
            echo "--- clippy $pkg --test $t"
            cargo clippy -q -p "$pkg" --features perf-walltime --test "$t" --locked -- -D warnings
            found=$((found + 1))
          done
        done
        # A wrong path returns zero targets silently; refuse that.
        test "$found" -gt 0 || { echo "no perf-gated targets discovered — the discovery is broken, not the repo"; exit 1; }
        echo "linted $found perf-gated targets"
      - sccache --show-stats || echo "WARNING sccache stats unavailable — caching may be inoperative"

  # deny.toml enforces the fork one-copy law, licenses, and sources — parity
  # with the GH lane's cargo-deny-action. cargo-deny is baked into the image
  # (Dockerfile.ci), so the lane is one command.
  - name: "deny (cargo-deny: bans, licenses, sources, advisories)"
    depends_on: []
    image: *rust_image
    pull: false
    environment:
      # NOT the shared *cargo_home: the advisory DB is a git working copy, and
      # a SHARED one has no safe state after a killed run — pipelines 115/116
      # were killed mid-fetch and wedged the clone for everyone
      # ("fatal: shallow file has changed since we read it", still red at
      # 118/119, fixed only by deleting the directory on the host). A flock
      # serializes writers but cannot repair a dead writer's half-written
      # tree. This CARGO_HOME lives inside the step container, so it cannot
      # outlive the run and no run can inherit another's corruption; the
      # advisory DB is cloned fresh each time from our forge mirror
      # (deny.toml [advisories] db-urls — ~6 MB, seconds on the LAN).
      CARGO_HOME: /tmp/deny-cargo
    commands:
      # The shared registry/git caches are owned by the test lane's ci user
      # (uid 1000); cargo-deny shells out to the git CLI as root, which
      # refuses another user's repo ("dubious ownership"). The exception is
      # root's global config inside this ephemeral container.
      - git config --global --add safe.directory '*'
      # Share only what cargo itself locks correctly — the registry/git
      # download caches, plus the .package-cache lock FILE: a symlink resolves
      # to the same inode, so cargo's flock still serializes this lane against
      # every other lane on the host. advisory-dbs is deliberately absent from
      # this list; it is the state we want per-run.
      - mkdir -p /tmp/deny-cargo /ci-cache/meridian-rs/cargo/registry /ci-cache/meridian-rs/cargo/git
      - touch /ci-cache/meridian-rs/cargo/.package-cache /ci-cache/meridian-rs/cargo/.package-cache-mutate
      - ln -s /ci-cache/meridian-rs/cargo/registry /ci-cache/meridian-rs/cargo/git /ci-cache/meridian-rs/cargo/.package-cache /ci-cache/meridian-rs/cargo/.package-cache-mutate /tmp/deny-cargo/
      # --log-level error: on green this lane printed 2408 lines, 2340 of them
      # inclusion-graph trees for 12 duplicate-crate WARNINGS that gate
      # nothing. -s keeps the per-check tallies, so the warning COUNT still
      # prints — the number survives, its 2340-line graph does not. Any real
      # error still prints in full, and the exit code is untouched.
      - cargo deny --log-level error check -s

  # Harness bit-rot catches, not perf gates: one iteration per bench target,
  # then render the live claims table into the CI log. Wall-time numbers are
  # NEVER gated in this lane — that stays perf.yml's job.
  # bench-report runs --release so it reuses the bench-profile artifacts
  # `cargo bench` just compiled (bench inherits release); a dev-profile run
  # would rebuild the same dep tree a second time.
  - name: bench smoke + claim verdicts (perfsuite harness)
    depends_on: []
    image: *rust_image
    pull: false
    environment:
      CARGO_HOME: *cargo_home
      CARGO_BUILD_JOBS: *build_jobs
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /ci-cache/sccache/bench
      SCCACHE_CACHE_SIZE: *sccache_size
      CC: "sccache cc"
      CXX: "sccache c++"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always
    commands:
      # -q on both invocations: the claims table is the output of this lane,
      # and a compile scroll ahead of it is what buries it.
      - cargo bench -q -p perfsuite --locked -- --test
      # --results redirects the renderings into the ignored target dir. The
      # default results/ dir is GIT-TRACKED, and lanes share one workspace:
      # rewriting it mid-pipeline dirtied the tree under the test lane, whose
      # build_identity test asserts binary identity == git state (pipeline
      # #25 — a race the bench lane won only when its cache was warm). The
      # table still prints to stdout for the CI log.
      - cargo run -q --locked --release -p perfsuite --bin bench-report -- --results target/ci-results
      - sccache --show-stats || echo "WARNING sccache stats unavailable — caching may be inoperative"

  # PUBLISH the engine. Downstream repos gate on a LIVE `mrd` (ccc-statusd's
  # internal/mcpserver, internal/registryclient, internal/cutover — no-skip by
  # design, MERIDIAN_MRD_BIN or fail), and no CI anywhere could run those lanes
  # because this repo produced no consumable artifact. It does now.
  #
  # The pin a consumer records is (COMMIT, SHA256) and the URL is derived from
  # the commit — never `latest`, which is what makes a downstream red mean "the
  # engine changed under me" instead of "the engine drifted silently".
  #
  # Forgejo's generic registry is APPEND-ONLY per (name, version, file): a
  # re-run of the same commit gets 409 and the FIRST published bytes stay
  # authoritative. That is the property the pin needs — a rebuild that differs
  # byte-wise (Rust builds are not bit-reproducible here) must never silently
  # invalidate a digest a consumer already recorded.
  #
  # main + manual only: a PR's engine is not a thing anyone should pin.
  #
  # GATED, and the only step in this file that is. The DAG header above is about
  # VERDICT lanes: they must not mask each other, so none of them waits. This
  # step produces no verdict — it produces the artifact downstream repos PIN —
  # and with `depends_on: []` it started alongside the verdict lanes and often
  # finished first, so a red main push published its bytes anyway. Same class as
  # ccc-statusd pipeline 821 (2026-08-23: go-test FAILURE / deploy SUCCESS),
  # fixed there by a workflow-level `depends_on: [{name: ci, optional: true}]`;
  # here the lanes live in this same workflow, so the dependency is step-level.
  # Woodpecker skips a step whose dependency failed, so a red lane now leaves
  # this step never-run. EVERY lane is named on purpose: the artifact must not
  # ship on a tree that failed any check we run, and a lane added tomorrow has
  # to be added here too. Card: 22-18/tasks/meridian-rs-publish-not-gated.
  - name: publish mrd (forgejo generic package, keyed by commit)
    depends_on:
      - test (cargo test --workspace --locked)
      - fmt (cargo fmt --all --check)
      - clippy (workspace lint policy, escalated)
      - clippy the perf-gated targets (compiled here, never run)
      - "deny (cargo-deny: bans, licenses, sources, advisories)"
      - bench smoke + claim verdicts (perfsuite harness)
    when:
      - event: push
        branch: main
      - event: manual
    image: *rust_image
    pull: false
    environment:
      CARGO_HOME: *cargo_home
      CARGO_BUILD_JOBS: *build_jobs
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /ci-cache/sccache/publish
      SCCACHE_CACHE_SIZE: *sccache_size
      CC: "sccache cc"
      CXX: "sccache c++"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_TERM_COLOR: always
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      # STAMP THE IDENTITY, MEASURED — never invented (crates/mrd/build.rs § the
      # two rules). The script's own git probe answers `unknown` in this
      # container (the workspace is not the probe's to trust: other lanes run as
      # other uids in it), and a daemon that publishes `unknown` fails every
      # consumer gate that asks WHICH build answered — measured downstream:
      # ccc-mcp-server TestColdDaemonIsSpawnedAndVerified, "the tree build must
      # publish a named identity, got unknown".
      #
      # So CI supplies the claim and OWNS it: the sha Woodpecker checked out,
      # plus `-dirty` if this workspace actually diverges from it. Both halves
      # are read here, so the stamp asserts exactly what was measured.
      #
      # THE PROBE IS THE ENGINE'S OWN, FLAG FOR FLAG (crates/mrd/build_git.rs
      # worktree_dirty): --untracked-files=no, --no-optional-locks. A supplied
      # MRD_BUILD_SHA rides verbatim into the binary, so this probe must ask the
      # question the engine asks — "does TRACKED content diverge from HEAD" —
      # and not a stricter one. Measured, and it is why this hunk exists: with a
      # bare `git status --porcelain` the test lane's `target-ci/` (its
      # CARGO_TARGET_DIR, untracked, sharing this workspace) read as divergence
      # and EVERY main head shipped a `-dirty` pin — 1244 `3259343e1`, 1259
      # `0d60d29be`, 1262 `ed15def72`, 1275 `4640044e0`, each log carrying
      # exactly one porcelain line, `?? target-ci/`. The tag lanes already probe
      # this way after the same defect bit them (d3accfbe4e28…-dirty).
      # --no-optional-locks keeps the probe from writing the index under a
      # concurrent git in the shared workspace.
      #
      # AND IT FAILS, it does not warn. `-dirty` here means a lane wrote a
      # TRACKED file mid-pipeline — the pin would name bytes no sha can recover
      # (crates/mrd/tests/rules_cli.rs:1407 refuses a dirty tree for that
      # reason), and a WARNING that never fails is ceremony: it printed on four
      # consecutive main heads and stopped nothing.
      # Card: 19-20/tasks/main-publish-stamps-dirty-on-every-head.
      - |
        set -eu
        git config --global --add safe.directory "$CI_WORKSPACE"
        if [ -n "$(git --no-optional-locks status --porcelain --untracked-files=no)" ]; then
          echo "tracked content diverges from $${CI_COMMIT_SHA} — refusing to publish a pin no sha can recover"
          git --no-optional-locks status --porcelain --untracked-files=no
          exit 1
        fi
        echo "MRD_BUILD_SHA=$${CI_COMMIT_SHA}" > /tmp/stamp.env
        cat /tmp/stamp.env
      # Shared ./target with the bench lane on purpose: bench inherits the
      # release profile, so the release dep tree is already compiled there and
      # cargo's build-dir flock serializes the two.
      - env $(cat /tmp/stamp.env) cargo build -q --locked --release -p mrd
      # The artifact must be the thing consumers run, so ASK it — a build that
      # produced an unrunnable binary, or one that cannot say WHICH build it is,
      # must not reach the registry. The identity check is structural on
      # purpose: `unknown` is a legal stamp, so nothing but an assertion here
      # keeps an unattributable engine out of a downstream pin.
      - |
        set -eu
        ver="$(./target/release/mrd --version)"
        echo "$${ver}"
        case "$${ver}" in
          *unknown*) echo "this build cannot name the tree it came from — refusing to publish it"; exit 1 ;;
        esac
        echo "$${ver}" | grep -q "$${CI_COMMIT_SHA}" || {
          echo "the stamp does not name $${CI_COMMIT_SHA} — the pin would lie about what it is"; exit 1; }
      - |
        set -eu
        sha="$(sha256sum target/release/mrd | cut -d' ' -f1)"
        rev="$${CI_COMMIT_SHA}"
        base="https://git.0xdao.app/api/packages/caoer115/generic/mrd/$${rev}"
        echo "engine: meridian-rs $${rev}"
        echo "  sha256: $${sha}"
        echo "$${sha}  mrd-linux-amd64" > /tmp/mrd-linux-amd64.sha256
        put() {
          code="$(curl -s -o /tmp/put.out -w '%{http_code}' -X PUT \
            -H "Authorization: token $${FORGEJO_TOKEN}" \
            --upload-file "$$1" "$${base}/$$2")"
          case "$${code}" in
            201) echo "published $$2" ;;
            # Append-only: this commit is already published and those bytes win.
            409) echo "$$2 already published for this commit — keeping the FIRST bytes (append-only)" ;;
            *)   echo "publish $$2 failed: HTTP $${code}"; cat /tmp/put.out; exit 1 ;;
          esac
        }
        put target/release/mrd mrd-linux-amd64
        put /tmp/mrd-linux-amd64.sha256 mrd-linux-amd64.sha256
        # Print what a consumer must record, so the pin is copyable out of the
        # log rather than reconstructed.
        echo ''
        echo 'pin for downstream .mrd-pin:'
        echo "  MRD_COMMIT=$${rev}"
        echo "  MRD_SHA256=$$(curl -fsSL -H "Authorization: token $${FORGEJO_TOKEN}" "$${base}/mrd-linux-amd64.sha256" | cut -d' ' -f1)"
      - sccache --show-stats || echo "WARNING sccache stats unavailable — caching may be inoperative"
