# Standalone spike — NOT a member of the meridian-rs workspace.
# The empty [workspace] table makes this its own workspace root so cargo does
# not walk up into crates/* (law crates stay clean; this is throwaway code).
[workspace]

[package]
name = "duckdb-spike"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
# bundled: compiles libduckdb from the crate's vendored amalgamation, so the
# writer and the second-process reader are guaranteed the same storage format.
duckdb = { version = "1.10504.0", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
