# candidate/collapse-first — cargo/tokio-school workspace (RFC 1318: crate
# boundaries are cost; split only when a second consumer or an
# unbreakable-by-construction invariant demands it). Four members, no more.
# Where the absent satellites split out and on what trigger: README.md.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# internal — {path, version} form makes a publish retrofit mechanical (axis D)
meridian = { path = "crates/meridian", version = "0.0.0" }
wire = { path = "crates/wire", version = "0.0.0" }
# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"

# Fork consumed Zed/lsp-types-mode (axis B): [patch.crates-io] at the workspace
# root guarantees one copy graph-wide (pulldown-cmark is a common transitive
# dep); fork version stays equal to upstream's; merge-from-upstream on the
# `obsidian` branch. Each rev bump gets a comment naming its upstream PR.
# Dev-loop path override goes in an uncommitted .cargo/config.toml, never here.
[patch.crates-io]
pulldown-cmark = { git = "https://github.com/caoer/pulldown-cmark", rev = "bc5df96c23da33283ef53c1a8dcfc53d7b6cd4fb" } # obsidian HEAD, pre-ENABLE_OBSIDIAN_* (step 0 repins)
