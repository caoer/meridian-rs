# meridian-rs workspace.
# Workspace conventions (non-negotiable): resolver 2, publish=false,
# internals 0.0.0, {path, version="0.0.0"} deps, [patch.crates-io] fork pin.

[workspace]
resolver = "2"
members = ["crates/*"]
# perfsuite is out of default-members (criterion stays off the everyday build path)
default-members = [
    "crates/addr",
    "crates/syntax",
    "crates/model",
    "crates/fs",
    "crates/wire",
    "crates/wire-map",
    "crates/receipt",
    "crates/transport",
    "crates/policy",
    "crates/query",
    "crates/wire-serve",
    "crates/render",
    "crates/sidecar",
    "crates/testsuite",
    "crates/workspace",
    "crates/cache",
    "crates/registry",
    "crates/effects",
    "crates/run",
    "crates/realise",
    "crates/mrd",
    "crates/view",
    "crates/preset",
    "crates/check",
    "crates/lock",
    "crates/git",
    "crates/config",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal crates: path + version 0.0.0 — mechanical publish retrofit later
# The agent-plane address leaf (stage 3, D4): `std`-only, zero deps, UPSTREAM of
# `syntax` — an address becomes a value here, so nothing downstream re-splits a
# string (docs/address-grammar.md § 7.1).
addr = { path = "crates/addr", version = "0.0.0" }
syntax = { path = "crates/syntax", version = "0.0.0" }
model = { path = "crates/model", version = "0.0.0" }
fs = { path = "crates/fs", version = "0.0.0" }
wire = { path = "crates/wire", version = "0.0.0" }
wire-map = { path = "crates/wire-map", version = "0.0.0" }
wire-serve = { path = "crates/wire-serve", version = "0.0.0" }
render = { path = "crates/render", version = "0.0.0" }
sidecar = { path = "crates/sidecar", version = "0.1.0" }
receipt = { path = "crates/receipt", version = "0.0.0" }
transport = { path = "crates/transport", version = "0.0.0" }
policy = { path = "crates/policy", version = "0.0.0" }
query = { path = "crates/query", version = "0.0.0" }
workspace = { path = "crates/workspace", version = "0.0.0" }
cache = { path = "crates/cache", version = "0.0.0" }
registry = { path = "crates/registry", version = "0.0.0" }
effects = { path = "crates/effects", version = "0.0.0" }
run = { path = "crates/run", version = "0.0.0" }
realise = { path = "crates/realise", version = "0.0.0" }
view = { path = "crates/view", version = "0.0.0" }
lock = { path = "crates/lock", version = "0.0.0" }
preset = { path = "crates/preset", version = "0.0.0" }
check = { path = "crates/check", version = "0.0.0" }
# The git plumbing organ (S5): shell-out content-addressing + reachability. A
# std-only leaf, so `mrd`/`wire-serve`/`view` can each take the edge.
git = { path = "crates/git", version = "0.0.0" }
# The MERIDIAN.md config plane (stage 3, D4): the one entry point parsed as
# content. Downstream of `model` — it is the markdown engine's own parser that
# gives the config a rev, which is what "config is content" means.
config = { path = "crates/config", version = "0.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fenced-Starlark evaluation, shared by `policy` (rung-6 predicates) and `effects`
# (the effect kernel). Pinned EXACT (=0.14.2): starlark-rust disclaims API
# stability and 0.14 introduced the per-eval resource meters (tick/heap) both
# crates rely on — a silent minor bump could move that surface. One workspace
# pin keeps a single copy in the graph (row-13 wire-invariance holds: no wire
# crate names it).
starlark = "=0.14.2"
# starlark `#[starlark_module]` builtins return `anyhow::Result`; both starlark
# consumers surface it. Already in the lock via starlark's own tree.
anyhow = "1"
# sha256 over canonical-path bytes = the cache drawer key (crates/cache).
sha2 = "0.10"
# Linker-assembled registration, used by `lock` for the engine-emits property
# (#8 §1, U36): each canonical writer declares its own block language next to
# itself, so the engine-emitted SET is collected by the linker and no list of
# names exists anywhere to silently omit a new member. Already in the lock via
# starlark's own tree — this makes the existing edge direct, not new.
inventory = "0.3"
pulldown-cmark = "0.13"
# The DuckDB view-organ sink (crates/view, a write-only C2 leaf). `bundled`
# compiles the vendored amalgamation so the gate SQL is pinned to one DuckDB
# version, never the host's libduckdb. Design validated on v1.5.2 (Variegata);
# the crate's gate tests re-confirm the SQL behaviors against whatever the
# resolved crate bundles.
duckdb = { version = "1", features = ["bundled"] }
# criterion without plotters/html: critcmp reads estimates.json, reports come
# from bench-report — the plotting stack is pure build-time cost here.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
toml = "0.8"
rand_chacha = "0.9"
hdrhistogram = "7"
# Kernel test stack (decisions/0003 § Testing methodology): insta = golden
# descriptor snapshots; proptest = invariants (determinism, fuel bounds, no
# panic on any event). Dev-only; the plain `cargo test` path drives both (no
# extra cargo subcommand needed — cargo-insta is optional review sugar).
insta = { version = "1", features = ["json"] }
proptest = "1"

# One lint policy for the whole workspace; every crate opts in via
# `[lints] workspace = true`. Warn-level locally; CI escalates with -Dwarnings.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Fork consumption: [patch.crates-io] at the
# workspace root guarantees ONE pulldown-cmark copy graph-wide, including transitive
# edges. Fork version stays equal to upstream's; merge-from-upstream on branch
# `obsidian`; each rev bump gets a comment naming its upstream PR.
[patch.crates-io]
# obsidian HEAD 2026-07-18 (pre-Step-0 fork point; repin as ENABLE_OBSIDIAN_* lands)
pulldown-cmark = { git = "https://github.com/caoer/pulldown-cmark", rev = "bc5df96c23da33283ef53c1a8dcfc53d7b6cd4fb" }
