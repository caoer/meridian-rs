# meridian-rs workspace.
# Workspace conventions (non-negotiable): resolver 2, publish=false,
# internals 0.0.0, {path, version="0.0.0"} deps, [patch.crates-io] fork pin.

[workspace]
resolver = "2"
members = ["crates/*"]
# perfsuite is out of default-members (criterion stays off the everyday build path)
default-members = [
    "crates/syntax",
    "crates/model",
    "crates/fs",
    "crates/wire",
    "crates/wire-map",
    "crates/receipt",
    "crates/transport",
    "crates/transport-proto",
    "crates/policy",
    "crates/query",
    "crates/sidecar",
    "crates/cli",
    "crates/testsuite",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal crates: path + version 0.0.0 — mechanical publish retrofit later
syntax = { path = "crates/syntax", version = "0.0.0" }
model = { path = "crates/model", version = "0.0.0" }
fs = { path = "crates/fs", version = "0.0.0" }
wire = { path = "crates/wire", version = "0.0.0" }
wire-map = { path = "crates/wire-map", version = "0.0.0" }
receipt = { path = "crates/receipt", version = "0.0.0" }
transport = { path = "crates/transport", version = "0.0.0" }
transport-proto = { path = "crates/transport-proto", version = "0.0.0" }
policy = { path = "crates/policy", version = "0.0.0" }
query = { path = "crates/query", version = "0.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
# criterion without plotters/html: critcmp reads estimates.json, reports come
# from bench-report — the plotting stack is pure build-time cost here.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
toml = "0.8"
rand_chacha = "0.9"
hdrhistogram = "7"
# typed proto transport: prost pair pinned together; build needs `protoc`
prost = "0.14"
prost-build = "0.14"

# One lint policy for the whole workspace; every crate opts in via
# `[lints] workspace = true`. Warn-level locally; CI escalates with -Dwarnings.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Fork consumption: [patch.crates-io] at the
# workspace root guarantees ONE pulldown-cmark copy graph-wide, including transitive
# edges. Fork version stays equal to upstream's; merge-from-upstream on branch
# `obsidian`; each rev bump gets a comment naming its upstream PR.
[patch.crates-io]
# obsidian HEAD 2026-07-18 (pre-Step-0 fork point; repin as ENABLE_OBSIDIAN_* lands)
pulldown-cmark = { git = "https://github.com/caoer/pulldown-cmark", rev = "bc5df96c23da33283ef53c1a8dcfc53d7b6cd4fb" }
