# meridian-rs workspace.
# Workspace conventions (non-negotiable): resolver 2, publish=false,
# internals carry the workspace version, {path, version} deps that track it,
# [patch.crates-io] fork pin.

[workspace]
resolver = "2"
members = ["crates/*"]
# perfsuite is out of default-members (criterion stays off the everyday build path)
default-members = [
    "crates/timing",
    "crates/addr",
    "crates/syntax",
    "crates/model",
    "crates/fs",
    "crates/wire",
    "crates/wire-map",
    "crates/receipt",
    "crates/transport",
    "crates/policy",
    "crates/query",
    "crates/wire-serve",
    "crates/render",
    "crates/testsuite",
    "crates/workspace",
    "crates/cache",
    "crates/registry",
    "crates/effects",
    "crates/run",
    "crates/realise",
    "crates/mrd",
    "crates/view",
    "crates/preset",
    "crates/check",
    "crates/lock",
    "crates/git",
    "crates/config",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caoer/meridian-rs"
publish = false

[workspace.dependencies]
# internal crates: path + the workspace version — mechanical publish retrofit later
# The timing instrument (docs/status.md § The timing mode): `std`-only, ZERO
# deps, under every layer — `fs`, `run` and `mrd` take it, and an instrument
# that knows nothing about them can sit beneath all three without a cycle.
timing = { path = "crates/timing", version = "1.1.0" }
# The agent-plane address leaf: `std`-only, zero deps, UPSTREAM of
# `syntax` — an address becomes a value here, so nothing downstream re-splits a
# string (docs/address-grammar.md § 7.1).
addr = { path = "crates/addr", version = "1.1.0" }
syntax = { path = "crates/syntax", version = "1.1.0" }
model = { path = "crates/model", version = "1.1.0" }
fs = { path = "crates/fs", version = "1.1.0" }
wire = { path = "crates/wire", version = "1.1.0" }
wire-map = { path = "crates/wire-map", version = "1.1.0" }
wire-serve = { path = "crates/wire-serve", version = "1.1.0" }
render = { path = "crates/render", version = "1.1.0" }
receipt = { path = "crates/receipt", version = "1.1.0" }
transport = { path = "crates/transport", version = "1.1.0" }
policy = { path = "crates/policy", version = "1.1.0" }
query = { path = "crates/query", version = "1.1.0" }
workspace = { path = "crates/workspace", version = "1.1.0" }
cache = { path = "crates/cache", version = "1.1.0" }
registry = { path = "crates/registry", version = "1.1.0" }
effects = { path = "crates/effects", version = "1.1.0" }
run = { path = "crates/run", version = "1.1.0" }
realise = { path = "crates/realise", version = "1.1.0" }
view = { path = "crates/view", version = "1.1.0" }
lock = { path = "crates/lock", version = "1.1.0" }
preset = { path = "crates/preset", version = "1.1.0" }
check = { path = "crates/check", version = "1.1.0" }
# The git plumbing organ: shell-out content-addressing + reachability. A
# std-only leaf, so `mrd`/`wire-serve`/`view` can each take the edge.
git = { path = "crates/git", version = "1.1.0" }
# The MERIDIAN.md config plane: the one entry point parsed as
# content. Downstream of `model` — it is the markdown engine's own parser that
# gives the config a rev, which is what "config is content" means.
config = { path = "crates/config", version = "1.1.0" }

serde = { version = "1", features = ["derive"] }
# `raw_value` is what lets a consumer carry a response through VERBATIM: the
# §4.4 splice response is embedded in `ScriptTrace.commit` unmodified, and a
# `Value` would sort its keys and normalize its whitespace — a second
# commit-fact shape by re-serialization. A feature on a crate already in the
# graph; no new external crate enters and `cargo deny` is unchanged.
serde_json = { version = "1", features = ["raw_value"] }
# Fenced-Starlark evaluation, shared by `policy` (rung-6 predicates) and `effects`
# (the effect kernel). Pinned EXACT (=0.14.2): starlark-rust disclaims API
# stability and 0.14 introduced the per-eval resource meters (tick/heap) both
# crates rely on — a silent minor bump could move that surface. One workspace
# pin keeps a single copy in the graph (row-13 wire-invariance holds: no wire
# crate names it).
starlark = "=0.14.2"
# The AST behind `starlark::syntax::AstModule` — the script entry reads its echo
# positions (top-level statement reads) off the parsed module. Pinned to the same
# exact version so the two crates speak one AST; already in the lock via
# starlark's own tree, so this makes an existing edge direct, not new.
starlark_syntax = "=0.14.2"
# starlark `#[starlark_module]` builtins return `anyhow::Result`; both starlark
# consumers surface it. Already in the lock via starlark's own tree.
anyhow = "1"
# sha256 over canonical-path bytes = the cache drawer key (crates/cache).
sha2 = "0.10"
# Linker-assembled registration, used by `lock` for the engine-emits property:
# each canonical writer declares its own block language next to
# itself, so the engine-emitted SET is collected by the linker and no list of
# names exists anywhere to silently omit a new member. Already in the lock via
# starlark's own tree — this makes the existing edge direct, not new.
inventory = "0.3"
pulldown-cmark = "0.13"
# The DuckDB view-organ sink (crates/view, a write-only C2 leaf). `bundled`
# compiles the vendored amalgamation so the gate SQL is pinned to one DuckDB
# version, never the host's libduckdb. Design validated on v1.5.2 (Variegata);
# the crate's gate tests re-confirm the SQL behaviors against whatever the
# resolved crate bundles.
duckdb = { version = "1", features = ["bundled"] }
# criterion without plotters/html: critcmp reads estimates.json, reports come
# from bench-report — the plotting stack is pure build-time cost here.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
toml = "0.8"
rand_chacha = "0.9"
hdrhistogram = "7"
# The §6.4 event feed's kernel watcher (merkle-spec, "the engine owns its
# senses"): FSEvents on macOS, inotify on Linux, one recursive watch per
# workspace, hosted by the resident daemon (crates/registry). Row-13 wire
# invariance holds: no wire crate names it, and `fs` stays watcher-free so
# guard correctness structurally cannot consult the feed (§6.4 guard-plane
# law).
notify = "8"
# Kernel test stack: insta = golden
# descriptor snapshots; proptest = invariants (determinism, fuel bounds, no
# panic on any event). Dev-only; the plain `cargo test` path drives both (no
# extra cargo subcommand needed — cargo-insta is optional review sugar).
insta = { version = "1", features = ["json"] }
proptest = "1"

# One lint policy for the whole workspace; every crate opts in via
# `[lints] workspace = true`. Warn-level locally; CI escalates with -Dwarnings.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Fork consumption: [patch.crates-io] at the
# workspace root guarantees ONE pulldown-cmark copy graph-wide, including transitive
# edges. Fork version stays equal to upstream's; merge-from-upstream on branch
# `obsidian`; each rev bump gets a comment naming its upstream PR.
[patch.crates-io]
# obsidian HEAD 2026-07-18 (fork point; repin as ENABLE_OBSIDIAN_* lands)
pulldown-cmark = { git = "https://github.com/caoer/pulldown-cmark", rev = "bc5df96c23da33283ef53c1a8dcfc53d7b6cd4fb" }
