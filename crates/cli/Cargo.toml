[package]
name = "mrd-cli"
description = "mrd — one-shot in-process wire client for the meridian engine"
# Product version, like the sidecar bin (axis D: internals 0.0.0, product
# version on the bins).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mrd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Pure wire client (locked decision 4): the engine rides in as the sidecar
# LIBRARY (`serve` driven with one in-memory NDJSON line per invocation) plus
# the wire vocabulary. No `model`, no `syntax` — the sidecar stays the only
# place wire and model meet (law 3 untouched).
sidecar = { path = "../sidecar", version = "0.1.0" }
fs = { workspace = true }
wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# test-only: temp vaults for the end-to-end binary tests.
tempfile = "3"
