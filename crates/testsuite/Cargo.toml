[package]
name = "testsuite"
description = "Consolidated integration-test member carrying the frozen GT pack as data — no library code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One consolidated integration-test binary (matklad doctrine: one binary,
# many modules — compile time ÷3, artifacts ÷5).
autotests = false

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
syntax = { workspace = true }
model = { workspace = true }
wire = { workspace = true }
transport = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# test-only: recompute file_rev independently of the model tree for the M2-BUILD
# oracle gate (conforming per gate 3 — blake3 stays a dev-edge outside `model`).
blake3 = "1"
