// meridian.v1 — protobuf transcription of wire-contract-v2 (the high-perf
// binary path). `wire` remains the canonical contract surface; this file
// TRANSCRIBES it and never amends it. Drift is pinned at compile time by
// tests/wire_agreement.rs: every message here is exhaustively destructured
// against its `wire` twin, so a new wire variant or field breaks that test's
// build until this file catches up.
//
// Encoding notes (proto has its own wire form; JSON-layer serde tricks do not
// transcribe):
//   - serde `flatten`/`untagged` become explicit oneofs.
//   - JSON `"id":null` on a response becomes field absence (`optional`).
//   - Newtypes (path/node_rev/root) are plain strings — they name, not validate.
//   - Enum ordinals shift by one for the proto3 UNSPECIFIED-0 convention; the
//     frozen sort-tiebreak ordinal lives in `wire`, not here.
//   - The JSON-layer hpath dual-deserialization (bare string ≡ {"h":…}) does
//     not transcribe: proto carries only the explicit HpathSeg form.

syntax = "proto3";

package meridian.v1;

// One frame: request or response. Field 3 is reserved for rung-4+ event
// frames (the v1 sidecar emits none — same reservation as the NDJSON layer).
message Frame {
  oneof kind {
    Request request = 1;
    Response response = 2;
  }
  reserved 3;
}

// ---------------------------------------------------------------------------
// contract v2 §4 requests — the op vocabulary
// ---------------------------------------------------------------------------

message Request {
  // Client correlation token, JSON integer in [0, 2^53). Optional for
  // shell-pipe debuggability; pipelining clients MUST send it.
  optional uint64 id = 1;
  oneof op {
    HelloRequest hello = 2;     // v2 §3.2
    TocRequest toc = 3;         // v2 §4.1
    ExtractRequest extract = 4; // v2 §4.3 (+ D-C5)
    ResolveRequest resolve = 5; // v2 §4.5 walk plane
    SpliceRequest splice = 6;   // v1 §6.2 sketch until W4-AMEND
    RootRequest root = 7;       // v2 §4.7
    CatRequest cat = 9;         // v2 §4.2
    DiffRequest diff = 10;      // v2 §4.7
    LinksRequest links = 11;    // v2 §4.6 (Q5-LINKS)
    SubRequest sub = 12;        // v2 §4.7 push path (T5-SUB)
    ViewPathRequest view_path = 13; // V2 §Q2 the view-organ path forwarder
  }
  reserved 8; // v1 guard, DELETED (D-C8) — never reuse
}

message HelloRequest {
  uint32 proto = 1;
  optional string client = 2;
  // v3-amendment negotiation (docs/wire-contract-v3-amendment.md): the
  // client-DECLARED contract rev. Additive field, never renumbered — absent
  // or "v2" is the frozen v2 vocabulary, "v3" the fingerprint vocabulary.
  optional string contract = 3;
  // Resident-engine handshake ([[0002-resident-daemon]] §4): the host path the
  // client binds this connection to — the daemon resolves it (ancestor walk),
  // pins its storage drawer, and warms its resident engine. Additive, never
  // renumbered; absent ⇒ a pure version handshake that binds nothing.
  optional string workspace = 4;
}

message TocRequest {
  string path = 1;
}

message CatRequest {
  string path = 1;
  // Absent ⇒ whole file (the response rev is the file_rev) — v2 §4.2.
  optional SecRef sec = 2;
}

message ExtractRequest {
  string path = 1;
  // Absent ⇒ no filter (all kinds); present-but-empty ⇒ match nothing.
  // The wrapper exists because that distinction is contractual and a bare
  // `repeated` cannot carry it. Unknown values in `kinds` are the server's
  // loud bad_request{unknown_kinds} (D-C5, v2 §4.3).
  optional KindFilter kinds = 2;
}

message KindFilter {
  repeated string kinds = 1;
}

message ResolveRequest {
  string from = 1; // mandatory: resolution is source-relative (v2 §4.5)
  string ref = 2;  // raw Obsidian linktext, brackets stripped by the interface
  optional bool content = 3;
}

// v2 §4.4: batch-only; no client span field exists anywhere in a request.
// Guardless/actor-less/receipt-less frames are legal at the wire forever;
// requirement is the Go ratchet (§5.3), never wire law.
message SpliceRequest {
  string path = 1;
  optional string actor = 2;   // opaque; wire input, never ambient (§9)
  optional string now = 3;     // RFC 3339; validated, never generated (§9)
  optional ReceiptAddr receipt = 4;
  optional string if_root = 5; // world-grain guard, checked FIRST (§5.1)
  optional bool dry = 6;
  repeated Edit edits = 7;
}

message ReceiptAddr {
  string path = 1;
  string anchor = 2;
}

message Edit {
  SecRef target = 1;
  EditShape edit = 2;
  optional string if_node_rev = 3; // node-grain guard (§5.1)
}

// Exactly two edit shapes (v2 §4.4).
message EditShape {
  oneof shape {
    MatchEdit match = 1;
    PutEdit put = 2;
  }
}

message MatchEdit {
  string old = 1;
  string new = 2;
}

message PutEdit {
  PutAt at = 1;
  string text = 2;
}

// at:"end" is RAW byte concatenation, no synthesized separator (§4.4) —
// text carries its own leading newline when it must begin a line.
enum PutAt {
  PUT_AT_UNSPECIFIED = 0;
  PUT_AT_ALL = 1;
  PUT_AT_CONTENT = 2;
  PUT_AT_END = 3;
  // upsert: set a frontmatter key (create-or-replace) — valid only on an
  // fm_key target; text is the VALUE, the server composes `{key}: {value}`.
  PUT_AT_UPSERT = 4;
}

// v2 §4.7: no parameters — the root is world-grain (the only root guard is
// splice.if_root; the v1 scoped/path variant went with guard).
message RootRequest {}

message DiffRequest {
  string from_root = 1;
  string to_root = 2;
}

// v2 §4.6: both optional — path absent ⇒ whole-corpus edge map;
// require_root is the §10.2 opt-in strictness knob (stale_view refusal).
message LinksRequest {
  optional string path = 1;
  optional string require_root = 2;
}

// v2 §4.7 push path (T5-SUB): ok (Root-shaped ack, advisor-ruled), then
// Notification frames each carrying one Delta. from_seq catchup is
// per-daemon-epoch (§7.1); outside retained history → root_unknown.
message SubRequest {
  uint64 from_seq = 1;
}

// V2 §Q2 the view-organ path forwarder request: resolve `cwd` → workspace,
// publish (daemon sole builder), return the stamped PATH. `cwd` is a RAW host
// path (absolute), NOT a workspace-relative wire path. `fresh` is the bounded
// --fresh knob (§Q3); absent ⇒ serve the published/first-built view.
message ViewPathRequest {
  string cwd = 1;
  optional bool fresh = 2;
}

// Half-open byte range [start, end) — contract v2 §1 span sub-laws.
message Span {
  uint64 start = 1;
  uint64 end = 2;
}

// ---------------------------------------------------------------------------
// contract v2 §2.1 the mint address grammar
// ---------------------------------------------------------------------------

// One strict mint-plane section ref — exactly the three §2.1 forms.
message SecRef {
  oneof form {
    HpathRef hpath = 1;
    string anchor = 2;
    string fm_key = 3;
  }
}

// Wrapper for the hpath form (a oneof arm cannot be `repeated`).
message HpathRef {
  repeated HpathSeg segs = 1;
}

message HpathSeg {
  string h = 1;
  // 1-based occurrence index among identical raw texts at that position.
  optional uint32 n = 2;
}

// ---------------------------------------------------------------------------
// contract v1 §5.2 node object (extract) + v2 §4.1 toc row
// ---------------------------------------------------------------------------

// Declaration order in `wire` IS the frozen sort tiebreak (frontmatter=0 …
// comment=10); here every ordinal is +1 for UNSPECIFIED-0. The agreement test
// pins the mapping variant-by-variant.
enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_FRONTMATTER = 1;
  NODE_KIND_HEADING = 2;
  NODE_KIND_FENCE = 3;
  NODE_KIND_INLINE_CODE = 4;
  NODE_KIND_ANCHOR = 5;
  NODE_KIND_WIKILINK = 6;
  NODE_KIND_EMBED = 7;
  NODE_KIND_CALLOUT = 8;
  NODE_KIND_TASK = 9;
  NODE_KIND_TABLE = 10;
  NODE_KIND_COMMENT = 11;
}

message Node {
  NodeKind kind = 1;
  Span span = 2;
  string text_prefix_16b = 3;
  // Headings only; empty ≡ absent (a heading always carries ≥1 segment —
  // one element per heading level, so no wrapper is needed). v2 §2.1 mint
  // grammar segments.
  repeated HpathSeg hpath = 4;
  optional bool unterminated = 5;
  optional Info info = 6;
  optional string node_rev = 7;
}

// One toc row (v2 §4.1). `kind` is an OPEN string: anchor-bearing block rows
// echo their host block kind (the contract's worked anchor row is
// "list_item", outside the closed extract enum).
message TocNode {
  string kind = 1;
  optional uint32 level = 2;
  // Heading rows only; empty ≡ absent (≥1 segment when present).
  repeated HpathSeg hpath = 3;
  optional string anchor = 4;
  Span span = 5;
  optional Span content_span = 6;
  string node_rev = 7;
  string text_prefix_16b = 8;
  // Frontmatter rows only. Wrapper: a frontmatter row carries `keys` even
  // when empty; absent ≡ not a frontmatter row — a bare `repeated` cannot
  // carry that distinction.
  optional KeyList keys = 9;
}

message KeyList {
  repeated string keys = 1;
}

// Per-kind info payloads (v1 §5.2 table). JSON discriminates by the sibling
// `kind`; proto carries the explicit oneof tag.
message Info {
  oneof info {
    FrontmatterInfo frontmatter = 1;
    FenceInfo fence = 2;
    WikilinkInfo wikilink = 3; // shared by wikilink and embed kinds
    CalloutInfo callout = 4;
    TaskInfo task = 5;
  }
}

message FrontmatterInfo {
  repeated string keys = 1;
}

message FenceInfo {
  string info_string = 1;
}

message WikilinkInfo {
  string target = 1;
  optional string heading = 2;
  optional string block = 3;
  optional string alias = 4;
}

message CalloutInfo {
  string type = 1;
  string fold = 2;
}

message TaskInfo {
  bool checked = 1;
  uint32 depth = 2;
}

// ---------------------------------------------------------------------------
// contract v2 §4 responses + §8 error envelope
// ---------------------------------------------------------------------------

message Response {
  // JSON serializes `"id":null` for un-correlatable errors; proto absence
  // carries the same meaning (the Frame oneof already classifies).
  optional uint64 id = 1;
  bool ok = 2;
  oneof body {
    HelloResponse hello = 3;
    NodesResponse nodes = 4; // extract (v2 §4.3)
    ResolveResponse resolve = 5;
    SpliceResponse splice = 6;
    RootResponse root = 7;
    ErrorBody error = 9;
    TocResponse toc = 10;   // v2 §4.1
    CatResponse cat = 11;   // v2 §4.2
    DiffResponse diff = 12; // v2 §4.7/§7.3 (D3-DELTA)
    LinksResponse links = 13; // v2 §4.6 + §10.1 triple (Q5-LINKS)
    ViewPathResponse view_path = 14; // V2 §Q2 the path forwarder reply
  }
  reserved 8; // v1 guard, DELETED (D-C8) — never reuse
}

message HelloResponse {
  uint32 proto = 1;
  string server = 2;
  repeated string caps = 3;
  // Optional first ambient root (the engine may not have walked yet) — v2 §3.2.
  optional string root = 4;
  // The pinned storage drawer ([[0002-resident-daemon]] §4 storage pin): the
  // cache drawer directory the daemon pinned for the hello'd workspace, via the
  // canonicalize → deny-ceiling → sentinel path. Additive, never renumbered;
  // absent on a workspace-less handshake and on the sidecar.
  optional string storage = 5;
}

message TocResponse {
  string path = 1;
  string file_rev = 2;
  string root = 3;
  repeated TocNode nodes = 4;
}

message NodesResponse {
  string path = 1;
  repeated Node nodes = 2;
}

message CatResponse {
  Span span = 1;
  string node_rev = 2;
  string content = 3;
}

// v2 §4.5: location facts ONLY — no rev field exists (D-C2, the mint
// partition as a type-level fact).
message ResolveResponse {
  string dest = 1;
  Span span = 2;
  optional string content = 3;
}

// v2 §4.4: the armed-facts shape — ONE response shape for every batch, dry
// included; never delivery claims (A7).
message SpliceResponse {
  Armed armed = 1;
  optional ReceiptFact receipt = 2;
  string root_before = 3;
  // JSON serializes root_after ALWAYS, null on dry; proto absence carries
  // the dry-null (the one contractual absence-vs-null on this shape).
  optional string root_after = 4;
  optional uint64 seq = 5;
  optional bool dry = 6;
  repeated Verdict verdicts = 7; // empty until rung 6 (P6-VERDICTS)
}

message Armed {
  string path = 1;
  repeated ArmedEdit edits = 2;
  // The whole-file rev AFTER the batch commits — a consumer learns the new
  // file rev without a follow-up toc (latency fact). Absent on dry (nothing
  // written), mirroring root_after's dry-null at file grain.
  optional string file_rev_after = 3;
}

message ArmedEdit {
  SecRef target = 1;
  string node_rev_before = 2;
  string node_rev_after = 3;
  Span span_after = 4;
}

message ReceiptFact {
  string path = 1;
  string anchor = 2;
  string node_rev = 3;
  Span span_after = 4;
}

// v2 §11.1 verdict — a typed FINDING from a loaded rule pack, never a decision
// (T1). Fields land with P6-VERDICTS; the array rode splice responses from birth
// (shape never changes at rung 6). `crates/policy`'s Violation, in THE grammar
// (hpath as segments, §2.1). `hpath` empty ≡ a rule-level finding (JSON absent).
message Verdict {
  string rule = 1;
  Severity severity = 2;
  string path = 3;
  repeated HpathSeg hpath = 4;
  Span span = 5;
  string node_rev = 6;
  string message = 7;
}

// v2 §11.1 severity — descriptive policy data (how bad, per the pack), never the
// action (Go's mapping). Mirrors `wire::Severity`.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARN = 2;
  SEVERITY_INFO = 3;
}

// v2 §4.7: root + seq (monotone per-workspace batch counter, per-daemon-epoch).
message RootResponse {
  string root = 1;
  uint64 seq = 2;
}

// v2 §4.6 under the §10.1 staleness triple. No lag bounds are promised, ever
// (honest-tense law): as_of_root ≠ live_root is a legal frame, never an error.
message LinksResponse {
  string as_of_root = 1;
  string live_root = 2;
  // The Delta counter at as_of_root — §7.1 per-daemon-epoch semantics.
  uint64 changes_seq = 3;
  // Keyed by corpus path. JSON serializes every corpus file's entry
  // (empty maps included); proto map absence of an entry never occurs on
  // the emit side, so no wrapper is needed.
  map<string, FileLinks> files = 4;
}

// One file's outgoing edges (the app's resolvedLinks/unresolvedLinks shape):
// per-edge counts. resolved keys are destination corpus paths; unresolved
// keys are the raw linkpaths as written.
message FileLinks {
  map<string, uint64> resolved = 1;
  map<string, uint64> unresolved = 2;
}

// V2 §Q2 the `view_path` reply: a stamped PATH plus a PRE-OPEN freshness hint —
// never rows. `path` is authoritative; the fingerprints/state/live_source are a
// hint the consumer discards once it re-reads the opened file's stamp. The
// fingerprint slots carry the v2 `root` vocabulary (as_of_root/live_root) — the
// v3 projection re-keys them to as_of_fingerprint/live_fingerprint.
message ViewPathResponse {
  // The stamped view.duckdb filesystem path — AUTHORITATIVE.
  string path = 1;
  // PRE-OPEN hint: the fingerprint the published file was built at.
  string as_of_root = 2;
  // PRE-OPEN hint: the daemon's live fingerprint sample (its warm at_fingerprint).
  string live_root = 3;
  // Per-daemon-epoch delta counter at the sample (§7.1); 0 until the ring lands.
  uint64 changes_seq = 4;
  // The daemon's pre-open freshness ASSESSMENT (hint, never a verdict).
  ViewState state = 5;
  // Provenance of live_root: watch/none on this pre-open hint (never fold).
  ViewLiveSource live_source = 6;
  // ALWAYS null on the pre-open hint (B5+C3: a hint is never a verdict). JSON
  // serializes `null`; proto absence carries the same always-absent tri-state.
  optional bool stale = 7;
  // OD7 advisory: a rebuild is in flight (round-1 synchronous ⇒ always false).
  bool refresh_in_progress = 8;
  // OD7 advisory: the last rebuild failure (daemon memory), if any.
  optional RefreshError last_error = 9;
}

// V2 §Q3 the pre-open freshness assessment. Round-1 emits FRESH_AT_SAMPLE /
// STALE / RACED; the wider state machine is a query-frame concern.
enum ViewState {
  VIEW_STATE_UNSPECIFIED = 0;
  VIEW_STATE_FRESH_AT_SAMPLE = 1;
  VIEW_STATE_STALE = 2;
  VIEW_STATE_RACED = 3;
}

// V2 §Q3 C3 the source-labeled live fingerprint. The view_path hint only ever
// uses WATCH/NONE; FOLD labels a consumer's post-result fold.
enum ViewLiveSource {
  VIEW_LIVE_SOURCE_UNSPECIFIED = 0;
  VIEW_LIVE_SOURCE_FOLD = 1;
  VIEW_LIVE_SOURCE_WATCH = 2;
  VIEW_LIVE_SOURCE_NONE = 3;
}

// V2 §OD7 refresh-failure telemetry (daemon memory, never the immutable stamp).
// Advisory only — it explains why a view is stale, never gates a freshness
// verdict. fingerprint_attempted is vocabulary-neutral (v3 leaves it untouched).
message RefreshError {
  RefreshErrorCode code = 1;
  uint64 unix = 2;
  optional string fingerprint_attempted = 3;
  string message = 4;
}

// V2 §OD7 the closed refresh-failure class.
enum RefreshErrorCode {
  REFRESH_ERROR_CODE_UNSPECIFIED = 0;
  REFRESH_ERROR_CODE_PARSE_ERROR = 1;
  REFRESH_ERROR_CODE_DISK_FULL = 2;
  REFRESH_ERROR_CODE_OOM = 3;
  REFRESH_ERROR_CODE_TIMEOUT = 4;
  REFRESH_ERROR_CODE_IO = 5;
}

// ---------------------------------------------------------------------------
// contract v2 §7 the Delta noun — the fifth noun, born frozen (D3-DELTA)
// ---------------------------------------------------------------------------

// v2 §4.7/§7.3 replay ≡ live: batches are the byte-identical live
// notification frames — catchup consumers and subscribers parse ONE shape;
// there is no second diff dialect.
message DiffResponse {
  repeated DeltaFrame batches = 1;
}

// One live notification frame body: `{"delta":{…}}` (v2 §7.1 worked frames;
// events carry no id, §3.1 classification).
message DeltaFrame {
  Delta delta = 1;
}

// The fifth wire noun (v2 §7.1, frozen at birth): one Delta = one batch =
// one root advance. `seq` is per-daemon-epoch (§7.1 law — no counter
// survives on disk; cross-epoch catchup is diff-by-root). actor/now absent
// on external changes (A8/§9). Node-grain at birth (decision 012, §7.4) —
// no key-grain slot exists on any message here.
message Delta {
  uint64 seq = 1;
  string root_before = 2;
  string root_after = 3;
  optional string actor = 4;
  optional string now = 5;
  repeated DeltaFile files = 6;
}

message DeltaFile {
  string path = 1;
  FileChange change = 2;
  // renamed carries the origin path (v2 §7.1 law).
  optional string from_path = 3;
  // Absent on created (no pre-state exists to hash).
  optional string file_rev_before = 4;
  // Absent on deleted (no post-state exists to hash).
  optional string file_rev_after = 5;
  repeated DeltaNode nodes = 6;
}

// v2 §7.1: file change ∈ {created, modified, deleted, renamed}.
enum FileChange {
  FILE_CHANGE_UNSPECIFIED = 0;
  FILE_CHANGE_CREATED = 1;
  FILE_CHANGE_MODIFIED = 2;
  FILE_CHANGE_DELETED = 3;
  FILE_CHANGE_RENAMED = 4;
}

// v2 §7.1/§7.2 node-grain entry: identity echoed in THE §2.1 grammar (same
// vocabulary as toc rows and armed facts — one projection, three tenses),
// rev transition, span after. Deepest-changed-node law (D-C7).
message DeltaNode {
  SecRef target = 1;
  NodeChange change = 2;
  // Absent on added (no pre-state exists).
  optional string node_rev_before = 3;
  // Absent on removed (no post-state exists).
  optional string node_rev_after = 4;
  optional Span span_after = 5;
}

// v2 §7.1: node change ∈ {added, edited, removed}.
enum NodeChange {
  NODE_CHANGE_UNSPECIFIED = 0;
  NODE_CHANGE_ADDED = 1;
  NODE_CHANGE_EDITED = 2;
  NODE_CHANGE_REMOVED = 3;
}

// v2 §8 error codes present at this rung — mirror `wire::ErrorCode` exactly,
// never lead it. Both formerly-remaining v2 codes have now joined with their
// ops: stale_view with links (Q5-LINKS), daemon_only with rule packs
// (P6-VERDICTS). v1 NOT_FOUND is RETIRED (§18 row 6): ordinal 6 reserved,
// never reused.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_BAD_FRAME = 1;
  ERROR_CODE_BAD_REQUEST = 2;
  ERROR_CODE_UNKNOWN_OP = 3;
  ERROR_CODE_UNSUPPORTED_PROTO = 4;
  ERROR_CODE_BAD_PATH = 5;
  reserved 6; // v1 not_found, retired
  ERROR_CODE_INVALID_UTF8 = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_CAS_MISMATCH = 9;
  ERROR_CODE_REF_NOT_FOUND = 10;
  ERROR_CODE_AMBIGUOUS_REF = 11;
  ERROR_CODE_ROOT_MISMATCH = 12;
  ERROR_CODE_ROOT_UNKNOWN = 13;
  ERROR_CODE_NO_MATCH = 14;
  ERROR_CODE_NOT_UNIQUE = 15;
  ERROR_CODE_WOULD_CORRUPT = 16;
  ERROR_CODE_LOCK_TIMEOUT = 17;
  ERROR_CODE_FILE_NOT_FOUND = 18;
  ERROR_CODE_IO_ERROR = 19;
  ERROR_CODE_STALE_VIEW = 20; // joined with links (Q5-LINKS), v2 §10.2
  ERROR_CODE_DAEMON_ONLY = 21; // joined with rule packs (P6-VERDICTS), v2 §8/§11.3
}

// v2 §8: the CLOSED six-class recovery enum; every error frame carries one.
enum Recovery {
  RECOVERY_UNSPECIFIED = 0;
  RECOVERY_FIX = 1;
  RECOVERY_ENV = 2;
  RECOVERY_REFRESH = 3;
  RECOVERY_RETRY = 4;
  RECOVERY_RESYNC = 5;
  RECOVERY_RESPAWN = 6;
}

// v2 §8: code + REQUIRED recovery class + optional human message +
// code-specific extras beside them, never nested further.
message ErrorBody {
  ErrorCode code = 1;
  Recovery recovery = 2;
  optional string message = 3;
  // bad_path / file_not_found: the offending path, echoed.
  optional string path = 4;
  // unsupported_proto: protos this sidecar speaks; non-empty when present
  // (a sidecar always speaks ≥1), so empty ≡ absent needs no wrapper.
  repeated uint32 supported = 5;
  // Pinned vs current token — cas_mismatch: node revs; root_mismatch:
  // full-width roots (code discriminates the grain).
  optional string expected = 6;
  optional string actual = 7;
  // ref_not_found: failing walk stage (1|2); stage 2 carries dest (v2 §4.5).
  optional uint32 stage = 8;
  optional string dest = 9;
  // ambiguous_ref: each candidate in the §2.1 mint grammar; ≥2 when present,
  // so empty ≡ absent needs no wrapper.
  repeated SecRef candidates = 10;
  // bad_request on extract (D-C5): ≥1 unknown kind when present, so empty ≡
  // absent needs no wrapper.
  repeated string unknown_kinds = 11;
  // bad_request on a non-conforming raw id lexeme (B2 law, v2 §3.1): the
  // offending lexeme verbatim, beside id absence.
  optional string id_raw = 12;
  // root_mismatch: the drifted files; ≥1 when present (a mismatch names its
  // drift), so empty ≡ absent needs no wrapper. NO scope field: §18 row 2,
  // WAIVED — no scoped-root construct exists for it to describe.
  repeated string changed = 13;
  // no_match (0) / not_unique (2+): occurrence count of `old` in the target.
  // Wrapper-free would conflate 0-count with absence, and no_match's count
  // IS 0 — so the optional scalar carries it.
  optional uint32 matches = 14;
  // would_corrupt: hpaths the post-apply parse would lose; ≥1 when present.
  repeated HpathRef lost = 15;
  // io_error: the underlying cause.
  optional string cause = 16;
  // bad_request on non-disjoint batch targets: ≥2 when present.
  repeated SecRef overlap = 17;
  // stale_view (v2 §10.2): the demanded root + the world as sampled.
  optional string required = 18;
  optional string as_of_root = 19;
  optional string live_root = 20;
}
