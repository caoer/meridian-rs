[package]
name = "transport-proto"
description = "Typed protobuf transport (high-perf binary path): meridian.proto transcribing wire-contract-v1 + length-delimited framing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
prost = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
# The drift pin (law-3 amendment): `wire` stays the canonical contract; the
# agreement test exhaustively destructures every wire type into its proto twin,
# so contract evolution cannot silently leave the .proto behind. Dev-dependency
# only — the lib itself never sees wire (conversion seam joins with the sidecar
# proto negotiation, not before).
wire = { workspace = true }
