[package]
name = "config"
description = "The MERIDIAN.md plane: the one entry point parsed as content (a rev and a fingerprint like any page), fail-loud with no partial mount table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The document tree, the file_rev law (`blake3(bytes)[:16]`), and the
# fingerprint plane. `MERIDIAN.md` is parsed by the engine's own parser — that
# is what "config is content" means — so this crate is downstream of `model`
# and mints no rev law of its own (schema §7.1).
model = { workspace = true }
syntax = { workspace = true }
# The reserved `meridian-*` block-language namespace predicate
# (`lock::is_meridian_lang`). ONE predicate for every engine block, never an
# enumerated list (decision #8 §1) — this crate reuses it rather than growing a
# second spelling of the namespace.
lock = { workspace = true }
# The frontmatter is USER-authored YAML carrying arbitrary unknown keys
# (Obsidian properties: flow sequences, block sequences), and schema §4 requires
# `frontmatter-unparseable` to carry "the parser's own message". A hand-rolled
# `key: value` scanner reads `tags: [config, meridian` as a valid string and
# never notices — the exact implementation the pack's `frontmatter-unparseable`
# case exists to kill. So this crate takes the workspace's already-decided YAML
# library.
#
# SECOND PRODUCTION EDGE, accepted (S3-R14(b)): this crate was the deviation
# from `policy`'s one-crate-owns-YAML claim, stated rather than absorbed. The
# Advisor accepted it — the violation was forced, not chosen — and ruled that
# the confinement gets an instrument or gets struck. No NEW external crate
# entered the graph and the lockfile is unchanged (`cargo deny` unchanged).
# ENFORCED: `crates/testsuite/tests/yaml_confinement.rs` derives the taker set
# from `cargo metadata` and permits exactly `{policy, config}`. A third crate
# reddens it by name; dropping this edge reddens it too.
serde = { workspace = true }
serde_yaml = "0.9"

[dev-dependencies]
# The stated limit (S3-R7, schema §9): `~/MERIDIAN.md` lives in a DENIED
# workspace path, so the rev the config carries can never become an attested
# one. The criterion-4 gate asserts that limit in the same test that
# demonstrates the rev moving — a dev-only edge, because the deny ceiling at
# BIND is U7's production concern, not this unit's.
workspace = { workspace = true }
tempfile = "3"
