[package]
name = "workspace"
description = "Workspace identity: the discovery ladder (env override → git root → cwd default) as pure filesystem functions, canonicalization with on-disk case resolution, and the deny-ceiling predicate. Every answer names the rung that answered and refuses to hand over a defaulted root silently. A leaf crate that writes nothing to disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Single owner of the meridian cache-root resolution (the deny ceiling refuses
# that directory as a workspace, so it must name the SAME root the drawer
# addressing uses). `cache` owns it; this crate delegates rather than keeping a
# second copy that could drift (leader reconciliation memo). `cache` is a leaf
# utility (serde/sha2/libc) — not wire/model/sidecar, so Law 3 still holds.
cache = { workspace = true }

[dev-dependencies]
# test-only: tempfile builds on-disk fixtures (marker/git trees, symlinks,
# case-variant dirs). Already in the graph (fs, sidecar); no new dependency.
tempfile = "3"
