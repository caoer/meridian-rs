[package]
name = "registry"
description = "The daemon-held workspace registry (watchman model): a unix-socket NDJSON RPC server plus client library. The daemon is the sole writer of warm registrations — canonicalize, deny-ceiling enforce, first-writer-wins insert, drawer sentinel via cache, atomic state file, idle-reap (decision 0001 round 5). A DECLARED root (the hello `workspace` field) pins exactly and never widens to a registered ancestor; the ancestor walk serves cwd hints only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fixture support: `test_support::TestServer`, the one owner of a fixture's
# daemon + `TempDir` teardown order (card `fixture-drain-guard-followups`).
# Reached through DEV-dependency edges only — this crate's own self-edge below
# and `mrd`'s — so a production consumer of `registry` never compiles the
# module and never grows the `tempfile` edge. That is why `tempfile` is
# optional here rather than a plain dependency.
test-support = ["dep:tempfile"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The identity + safety layer: canonicalize (drawer-key input) and the
# deny-ceiling predicate the daemon enforces on every register. Leaf crate.
workspace = { workspace = true }
# The hashed drawer + sentinel: the daemon writes the drawer sentinel on a
# successful register (the single warm-registration writer). Leaf crate; its
# DrawerLock also serves as the daemon-singleton flock (no libc edge needed).
cache = { workspace = true }
# The resident query engine (decision 0002 spine root U1): the daemon holds a
# warm CorpusIndex + document map per workspace, rebuilt only when the corpus
# content hash changes. `fs` reads + folds the snapshot and parses it into the
# engine (the shared build primitives — one implementation, this one host);
# `model` carries the resident types (CorpusIndex, Document, MerkleRoot fingerprint).
fs = { workspace = true }
model = { workspace = true }
# § A.7 in-process script serve (2026-08-12): the daemon evaluates the script
# entry against the entry world — the kernel, the trace shape, and the armed
# digest all live in `effects` so this crate and the CLI lane reach ONE
# implementation of each.
effects = { workspace = true }
# § A.7 files[] pattern expansion (OQ3 ruling 2026-08-14): the entry pass
# expands patterns through the ONE scope glob grammar — `policy` owns it, and
# reaching it directly keeps a second implementation unmintable here.
policy = { workspace = true }
# § A.8 wire run serve (2026-08-13, run-crossing ruling): the op arm drives
# the run plane's own seam (`run::runner::run`) per target — the serve path
# consumes the plane, it never re-implements it (run-plane.md charter
# amendment). `run` sits strictly below the serve path: no cycle.
run = { workspace = true }
# The spine's read surface (U2): `query` serves toc/links over the resident
# index; `syntax` is the parser the resident build folds in (via `fs`). Declared
# here as the U1 engine's read/parse edges; the U1 gate exercises `query` over a
# warm engine to prove the resident state answers real queries.
query = { workspace = true }
syntax = { workspace = true }
# The wire contract (U2): the daemon socket now answers the frozen wire read ops
# (toc/cat/extract/links/root/diff/resolve). `wire` is the request/response
# vocabulary; `wire-serve` is the shared strict-decode + read-op arms, served
# from the resident engine's borrowed state (one implementation, this one host —
# hosts ruling, wire-contract §3.3).
wire = { workspace = true }
wire-serve = { workspace = true }
# The frame-layer seam (§3.1): `transport::scan_id` classifies and validates the
# raw `id` lexeme at the daemon door BEFORE typed decode — the B2 law this host
# owes (a non-conforming lexeme is refused `bad_request` with `id:null` +
# `id_raw`, never served, never reclassified as a notification). Leaf crate, no
# external edges; the daemon is the first serving host.
transport = { workspace = true }
# Stage-2 S6: the read-is-the-mint ledger type (`receipt::read_mint`). The daemon
# HOLDS one per workspace — the in-memory session layer a composed read mints
# into — deliberately outside the warm engine, whose rebuild would otherwise
# evaporate the receipt a pin's own write depends on. A path crate already in the
# graph via `wire-serve`, so no new external crate enters and `cargo deny` is
# unchanged.
receipt = { workspace = true }
# The `mounts` op (wire-contract § A.5): the daemon serves the machine's
# mount table — `config` owns resolve/parse/bind and every refusal word; the
# daemon only projects. `blake3` mints the § A.5 freshness token
# (`blake3(config bytes)[:16]`, the §1 file_rev law) for the per-call hash
# gate — the same dev-edge precedent as `policy`/`effects` (blake3 stays
# outside `model`'s public surface). Both already in the graph and lockfile.
config = { workspace = true }
blake3 = "1"
# Optional, and ONLY for the `test-support` fixture module (see [features]).
# Off by default, so this is not a production edge.
tempfile = { version = "3", optional = true }
# § A.10 wire `walk`: the serve arm hands the warm engine's projection to the
# SAME walk computer the CLI pin planes color through (`view::walk`) — the
# one-owner law; the corpus assembly it feeds lives in
# `wire_serve::mount_corpus`, already in the graph.
view = { workspace = true }
# The §6.4 event feed (merkle-spec): one kernel watcher per workspace
# (FSEvents/inotify), owned by this daemon — the engine process. The dirty
# set it accumulates is registry state (kimi D1 registration-lifetime law),
# which is why the edge lands here and NOT on `fs`: guards live in `fs`, and
# keeping it watcher-free makes "guard correctness consults neither journal
# nor watcher" structural.
notify = { workspace = true }
# The §6.7 currency split's production instrument (`docs/run-plane.md` §
# Timing phases): `currency_refresh` and `door_observation` each choose between
# the O(1) vouched path and the §6.2 extent-refresh floor, and until this edge
# existed neither choice left a trace outside `#[cfg(test)]`. A std-only,
# zero-dependency leaf that reads no clock and allocates nothing when
# `MRD_TIMING` is off, so the hot path pays for the answer only when asked.
timing = { workspace = true }

[dev-dependencies]
# The self-edge is how this crate's OWN integration tests get a lib compiled
# with `test-support` (the standard cargo idiom for a test-only feature). It
# also keeps `tempfile` — declared optional above — active for the test build,
# which is what the fixtures `use` directly.
registry = { path = ".", features = ["test-support"] }
# walk_op gates render green-pin fixtures through the one owner of the lock
# grammar; `model`/`syntax` (already runtime deps) mint the live fingerprints.
lock = { workspace = true }
