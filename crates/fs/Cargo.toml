[package]
name = "fs"
description = "Disk truth in, atomic splices out: read/walk/watch feeding the model; tmp+fsync+rename splice execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { workspace = true }
syntax = { workspace = true }
# The corpus fold's three phases under `MRD_TIMING` (docs/status.md § The
# timing mode). A std-only, zero-dependency leaf: it brings no member into this
# crate's graph, and it is silent and clock-free when the switch is off.
timing = { workspace = true }
# Law-2 interior hashing (merkle-spec §4.2): the radix child map mints
# `mrk2.vtx`/`mrk2.dir` values here — the same §1 hash family the rev/leaf
# laws use. Already in the graph via `model`; the edge becomes direct.
blake3 = "1"

# O_NOFOLLOW for the exec-window guard's symlink-refusing reads (guard.rs,
# #25). libc is already a graph dependency (cache/run); no new crate enters.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# test-only: the exec-guard gates compare close()'s verified root against an
# independently folded merkle_root (model is already a production dep).
model = { workspace = true }
# test-only: the §4.3.1 forest gates bind the ONE glob grammar
# (`policy::glob_match`) to the grammar-agnostic expansion — production code
# takes the predicate as a closure, so `policy` never enters the graph edge.
policy = { workspace = true }
# test-only: the canonicality property corpus for the radix child map (the
# workspace kernel-test convention); tempfile builds on-disk corpora.
proptest = { workspace = true }
# test-only: the B-03 fence matrix asserts EISDIR by errno and measures which
# filesystem backs each fixture (statfs). Already a production dep above.
libc = "0.2"
tempfile = "3"
