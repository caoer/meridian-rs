[package]
name = "perfsuite"
description = "Perf harness: profile-driven corpus generator, claims registry with verdicts, criterion seam benches + hdr p99 path, run reports — out of default-members"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand_chacha = { workspace = true }
hdrhistogram = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# seam crates appear as dev-deps only: benches and the dormant ≥-planted
# assertion consume them; the harness library itself is parser-agnostic.
syntax = { workspace = true }
model = { workspace = true }
policy = { workspace = true }
transport = { workspace = true }
transport-proto = { workspace = true }

[[bin]]
name = "corpusgen"
path = "src/bin/corpusgen.rs"

[[bin]]
name = "bench-report"
path = "src/bin/bench-report.rs"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "assemble"
harness = false

[[bench]]
name = "project"
harness = false

[[bench]]
name = "roundtrip"
harness = false

[[bench]]
name = "policy"
harness = false

# Not criterion: hand-written single-pass main (see the file header). Smoke
# lane (`-- --test`) downshifts to 50 files; full runs need explicit invocation
# or the perf lane's full sweep.
[[bench]]
name = "cold-ingest"
path = "benches/cold_ingest.rs"
harness = false
