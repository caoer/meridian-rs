# --- OD8: DuckDB view-organ gate (design tournament-duckdb/team-a §Perfsuite gate).
# These rows REGISTER the gate that must arm before the O(file_count + corpus_bytes)
# per-query fold is the default freshness path. V1 ships no bench harness, so every
# row is UNTESTED (the perf mirror of a todo!() body) — never a fabricated PASS. The
# ruleset-sourced rows stay MEASURED even once measured: no PASS until the named
# ruleset interactive bound is materialized into a concrete threshold. Until a
# measured PASS exists, fold-per-query is opt-in and the default returns
# live_source=none, stale=null (state=UNVERIFIED).

[[claim]]
id = "view.build.p99.vault_2026"
title = "V1 projector build p99 (warm docs -> DuckDB tables)"
metric = "ms"
direction = "lower"
harness = "benches/view.rs"
recipe = "vault-2026 seed=1 files=2000"
note = "OD8: view::build_memory/publish over the warm parsed corpus; baseline TBD on the first fleet run. No harness in V1 — this row registers the gate (UNTESTED until benches/view.rs lands)."

[[claim]]
id = "view.freshfold.p99.vault_1gb"
title = "Per-query live fingerprint fold p99 (fs::domain_snapshot, full corpus)"
metric = "ms"
direction = "lower"
threshold_source = "ruleset"
harness = "benches/view.rs"
recipe = "vault-1gb seed=1 files=180000"
note = "OD8: the O(file_count + corpus_bytes) post-result fold (no stat short-circuit). Gated against the perf ruleset's NAMED interactive-latency bound, not an invented literal. Stays MEASURED (never PASS) until that named rule is resolved to a concrete threshold — resolving it is itself part of arming fold-by-default. Landed cold-ingest measured 22.2 s / 1 GB / 180k files, so fold-per-query at that scale is not an interactive default."

[[claim]]
id = "view.freshfold.envelope.filecount"
title = "Freshfold cost envelope — file-count term (walk + per-file open)"
metric = "files"
direction = "lower"
threshold_source = "ruleset"
harness = "benches/view.rs"
recipe = "tiny-file profile: high file count, low bytes, seed=1"
note = "OD8: one of the fold's TWO independent cost terms. A single MB/s throughput number must NOT arm fold-by-default — it collapses the per-file term and lets a tiny-file corpus (high count, low bytes) falsely pass. Eligibility needs a passing envelope bounding BOTH file count and bytes, measured across a tiny-file AND a large-byte profile. Ruleset-sourced; UNTESTED until benches/view.rs lands."

[[claim]]
id = "view.freshfold.envelope.bytes"
title = "Freshfold cost envelope — bytes term (read + blake3 fold)"
metric = "bytes"
direction = "lower"
threshold_source = "ruleset"
harness = "benches/view.rs"
recipe = "large-byte profile: low file count, high bytes, seed=1"
note = "OD8: the second independent fold cost term, paired with view.freshfold.envelope.filecount. Both must pass across the tiny-file and large-byte profiles so neither term is extrapolated away. Ruleset-sourced; UNTESTED until benches/view.rs lands."

[[claim]]
id = "view.sql.roundtrip.p99.vault_2026"
title = "V3 mrd sql end-to-end p99 (open RO + stamp read + query + post-result fold)"
metric = "ms"
direction = "lower"
harness = "benches/view.rs"
recipe = "vault-2026 seed=1 files=2000"
note = "OD8: the number an agent feels for `mrd sql` — open the RO view, read the _meridian_view stamp as authoritative as_of, run the query client-side, fold live AFTER the result. Baseline TBD on the first fleet run. UNTESTED in V1 (registers the gate)."

# --- check lane (card G4, 2026-07-28): the two verbs an operator runs most had
# NO written budget anywhere — docs/status.md, laws.md and this file were all
# searched and none existed. That absence was part of the defect: a verb with no
# declared budget cannot regress, it can only disappoint. This registers the
# word WITHOUT inventing evidence for it — no baseline, because no bench has
# ever measured this path.

[[claim]]
id = "check.worktree.p99"
title = "mrd check (worktree interval) end-to-end wall time"
metric = "ms"
direction = "lower"
threshold = 2000.0
harness = "benches/check.rs"
recipe = "TBD — bench design is card scope; needs a field-notes-scale profile or a declared per-file rate"
note = "THRESHOLD PROVENANCE: ZT design-intent statement, 2026-07-28, quoted — \"our meridian-rs runs 180k md doc with total of 1GB for less than 2 seconds\". DESIGN INTENT ONLY, deliberately NOT benchmark-backed, and no baseline is declared because no bench has ever measured this path. The <2s figure at 180k/1GB belongs to ingest.codec.proto.vault_1gb — encode+decode of ALREADY-IN-MEMORY content, frames pre-built outside the timed window, no filesystem and no parse. This lane's own recorded filesystem number at that scale is ingest.cold.vault_1gb: 22.2 s baseline, 34.3 s at the 2026-07-26 run. Citing the codec envelope as backing for the walk+read+parse path was an unmeasured join; it is not repeated here. UNTESTED by absence of harness, never a fabricated PASS. Field evidence pending the bench (bfa6affe, field-notes, 2026-07-28, /usr/bin/time -p, 3 runs): 34.78 s cold / 22.07 s / 18.38 s warm, user CPU FLAT at 3.63-3.99 s, sys 6.43-13.89 s — 51-58% CPU utilisation, so roughly half the wall clock is off-CPU blocking I/O. The path is I/O-bound and serial, not parse-bound: userland total bounds parse+model from above at ~4 s. `mrd status` shares the same tree-fold cost and needs its own claim once this one has a harness."
