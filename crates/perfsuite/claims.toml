note = "P6-EVAL wall-time on the adversarial fence-saturated shape: p99 of one policy::evaluate call over a real AST. Measured not asserted (risk R2); ruleset-sourced gate pending vocab()"

[[claim]]
id = "policy.eval.budget.steps.vault_1gb"
title = "Declared per-eval step budget the admitted pack runs within (EvalBudget.steps)"
metric = "steps"
direction = "lower"
harness = "benches/policy.rs"
recipe = "vault-1gb shape, 200-file sample seed=1"
note = "P6-EVAL eval budget as data: the EvalBudget.steps the compiled blurb pack was admitted under (CompiledRuleset::budget()), deterministic/platform-free (post-eval tick-count). Runtime grounding: 0 of the sample's evals emitted a budget_exceeded finding (logged at run) — the declared envelope holds at scale. Best-effort in-process guard; the hard bound is OS/subprocess (daemon), never asserted here"

