[[claim]]
id = "policy.splice.match_scan.p99"
title = "D-C1 server-side old/new match scan p99 per edit (risk R2)"
metric = "us"
direction = "lower"
threshold_source = "ruleset"
harness = "benches/roundtrip.rs"
recipe = "vault-1gb / fence-bomb section spans"
note = "D-C1 (risk R2): match{old,new} resolved server-side by scanning target span bytes per edit, bounded by section size (the bytes just reparsed), measured not asserted (threshold_source=ruleset). MEASURED on the real model::validate_batch path: M4-VALIDATE landed validate_batch (validate_splice todo!() retired) and P6-VERDICTS armed it end-to-end on the splice arm; benches/roundtrip.rs::record_match_scan_claim times one match edit whose old sits at the tail of a large section so the scan walks the full span. A local number renders MEASURED, never a false PASS/FAIL (gate owned by the ruleset budget, not claims.toml)."
