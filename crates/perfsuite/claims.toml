# --- P6-PERF (pack §9): the declared-p99 story becomes measured. policy::evaluate
# over REAL model ASTs (P6-EVAL landed), sampled from the vault-1gb + fence-bomb
# profile shapes; D-C1's server-side match scan cost (risk R2) lands as a data row.
# Carry-forward: in-process Starlark step/heap guards are BEST-EFFORT; exact
# post-eval accounting is the metering layer; the HARD bound is subprocess/OS
# limits (a daemon concern). No row here asserts a hard in-process bound.

[[claim]]
id = "policy.evaluate.p99.vault_1gb"
title = "policy::evaluate p99 per document (real AST, vault-1gb shape)"
metric = "us"
direction = "lower"
threshold_source = "ruleset"
harness = "benches/policy.rs"
recipe = "vault-1gb shape, 200-file sample seed=1"
note = "P6-EVAL wall-time: p99 of one policy::evaluate call over a real model::build AST (blurb-required Starlark pack). Measured not asserted (risk R2 posture); gate arrives from policy vocab() Budget{p99_us} when it lands — ruleset-sourced so a local number never falsely PASS/FAILs"

[[claim]]
