# Real-world scale: vault-2026's empirical shape scaled to ~1 GiB of content
# (ZT ruling 2026-07-18) — the cold-ingest smoke detector's corpus. Same size
# distribution and survey-derived construct rates as vault-2026; only `files`
# differs: 180,000 × ~5.9 KB measured mean ≈ 1.06 GB. Consumed by
# `cold-ingest` (single cold pass, no repetition); generated once, cached.

name = "vault-1gb"
provenance = "vault-2026 shape (lane0-corpus survey, 21,856 files, frozen 2026-07-17T23:48Z) scaled ~9x past the real vault's 104.2 MB to 1 GiB-class; construct rates unchanged"
files = 180000

