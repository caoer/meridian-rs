# Perf-claim inventory — claims are data; benches are their evidence.
# `cargo run -p bench --bin bench-report` joins staged measurements against
# this file into PASS/FAIL/MEASURED/UNTESTED verdicts. UNTESTED is the perf
# mirror of a todo!() body: the claim exists from day 1, the verdict flips
# when the rung lands. Baselines: parser-bench rust-pulldown lane
# (RESULTS.md, frozen 2026-07-17, arm64 Mac, release+lto, GT 145/145).

[[claim]]
id = "parse.throughput.corpus"
title = "Corpus-sweep parse throughput"
metric = "MB/s"
direction = "higher"
baseline = 103.0
threshold = 82.0 # 0.8× baseline; regression gate arms when rung 1 lands
baseline_provenance = "parser-bench rust-pulldown lane: 103.0 MB/s, 18,891 files/s"
harness = "benches/parse.rs"
recipe = "vault-2026 seed=1 files=2000"
note = "rung 1 (syntax::parse)"

[[claim]]
id = "parse.p99.file"
title = "Per-file parse latency p99"
metric = "ms"
direction = "lower"
baseline = 3.2
threshold = 5.0
baseline_provenance = "parser-bench rust-pulldown lane: p99 3.2 ms over corpus sweep"
harness = "benches/parse.rs"
recipe = "vault-2026 seed=1 files=2000"
note = "rung 1"

