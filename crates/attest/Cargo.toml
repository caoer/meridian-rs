[package]
name = "attest"
description = "The attest operation (d2 §2.5 A7/E1, U2.5): attest = realised-gate + pin + receipt. Refuse iff (a) resolution fails, (b) the realised-gate is unmet, or (c) a declared check: predicate is false at the pinned rev; drifted pins never refuse (re-pin is attest's purpose), grey never refuses, a refused attest writes nothing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The pin half of attest: resolve (class a), check_claim (class c), re-pin drift,
# splice the ^inputs lock in ONE CAS write minting one receipt. attest COMPOSES
# pin — it never forks the write path (d2 §2.5; U2.4 landed).
pin = { workspace = true }
# Workspace root handle + page load for the realised-gate's pure board read.
fs = { workspace = true }
# The parsed document + frontmatter map the board gate reads (state / claim /
# last_receipt off a pending-agent card — the realise engine's output surface).
model = { workspace = true }
# AttestResult serializes to JSON for `mrd attest --json`.
serde = { workspace = true }

[dev-dependencies]
# real on-disk workspaces for the attest gate scenarios (pin write / re-pin /
# board card fixtures).
tempfile = "3"
