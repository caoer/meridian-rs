[package]
name = "wire"
description = "The frozen wire vocabulary: path/span/node_rev/root + op/request/response/error types (serde-only, zero I/O) — the only Go-visible surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `rc`: an hpath segment's text is a shared `Arc<str>` (merkle-spec §6.4).
serde = { workspace = true, features = ["rc"] }
# § A.11 sql result cells are arbitrary JSON scalars/arrays — the one wire
# body whose cell type is not a fixed struct.
serde_json = { workspace = true }

[dev-dependencies]
