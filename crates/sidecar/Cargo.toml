[package]
name = "sidecar"
description = "Thin NDJSON stdin/stdout binary — the only place wire and model meet"
# The one real product version in the workspace (axis D: internals 0.0.0,
# product version on the bin).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
transport = { workspace = true }
model = { workspace = true }
fs = { workspace = true }
# links (§4.6) parses the domain snapshot's exact bytes — the bytes the
# as_of_root folded — rather than re-reading disk through fs::load.
syntax = { workspace = true }
# Rung-5 corpus reads: the §4.6 edge map is query's (the additive-crate
# arrival — nothing reshuffles).
query = { workspace = true }
wire = { workspace = true }
# Law 3 as amended (review C1): projection lives at the named wire-map seam,
# tested there; this bin stays wiring-only.
wire-map = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# test-only: on-disk workspaces for the dispatch fixtures; the vendored
# harness/wsfix packs ride in via the testsuite data helpers.
tempfile = "3"
testsuite = { path = "../testsuite" }
