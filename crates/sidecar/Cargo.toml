[package]
name = "sidecar"
description = "Thin NDJSON stdin/stdout binary — the only place wire and model meet"
# The one real product version in the workspace (axis D: internals 0.0.0,
# product version on the bin).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
transport = { workspace = true }
model = { workspace = true }
fs = { workspace = true }
# links (§4.6) parses the domain snapshot's exact bytes — the bytes the
# as_of_root folded — rather than re-reading disk through fs::load.
syntax = { workspace = true }
# Rung-5 corpus reads: the §4.6 edge map is query's (the additive-crate
# arrival — nothing reshuffles).
query = { workspace = true }
# CALL-ONLY (advisor ruling, d4-splice): the splice arm renders receipt
# lines through it; edits to the crate itself need an ownership ruling.
receipt = { workspace = true }
# The DELIBERATE composition edge (P6-VERDICTS, advisor Ruling 1): the sidecar
# composes policy + the real parse pipeline in-process — the splice arm evaluates
# loaded rule packs and fills verdicts:[]. Zero edges run the OTHER way: nothing
# depends INTO policy that did not before (policy consumes supplied facts).
policy = { workspace = true }
wire = { workspace = true }
# Law 3 as amended (review C1): projection lives at the named wire-map seam,
# tested there; this bin stays wiring-only.
wire-map = { workspace = true }
# The shared typed edge (U2, arch map A6): the strict-decode pass and the read-op
# arms live here now, so the sidecar and the resident daemon answer the wire
# contract through ONE implementation. The sidecar builds the corpus per request
# and hands the borrowed state to these arms.
wire-serve = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# test-only: on-disk workspaces for the dispatch fixtures; the vendored
# harness/wsfix packs ride in via the testsuite data helpers.
tempfile = "3"
testsuite = { path = "../testsuite" }
