[package]
name = "policy"
description = "Rung-6 policy engine stub: compile rulesets-as-data, evaluate assertions under declared budgets, authorize I3-shaped writes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
model = { workspace = true }
# Ruleset YAML parsing is in-charter; the YAML library choice is a rung-6
# implementation decision — deliberately not pinned by the skeleton (see README).
# DECIDED (P6-COMPILE): serde + serde_yaml. Rationale: the §11.3 manifest is a
# tiny, rigid, well-typed schema — serde-derived deserialization is the fewest
# lines that can be wrong; serde_yaml is stable, ubiquitous, and offline-present;
# the wire boundary is trusted-local (§13), so YAML-parser CVE surface is bounded.
# CONFINEMENT (S3-R14(b)): this dependency (and its libyaml transitive) may appear
# in `cargo tree` production edges under `policy` and `config` — and no other crate.
# `config` is the second, STATED edge: user frontmatter is arbitrary YAML and schema
# §4 requires the parser's own message, which a hand-rolled scanner cannot give.
# (F3-DOMAIN still hand-parses mdfs_config.yaml precisely to avoid a third.)
# ENFORCED, not asserted: `crates/testsuite/tests/yaml_confinement.rs` derives the
# taker set from `cargo metadata` and reddens — naming the crate — when a third one
# takes it. Amend that test in the same motion as this comment, or neither.
serde = { workspace = true }
serde_yaml = "0.9"
# Content pin (§6.1 effect-style sha256): verify RulesetPin.sha256 over the
# manifest bytes before compile; mismatch fails loud, never evaluates.
sha2 = "0.10"
# The attested INDEX pinned rev (U1.4): `blake3(CHECK.md)[:16]` — the SAME rev law
# the world model mints (contract §1: blake3-256, first 16 hex), so a convention's
# evidence rev speaks the one rev grammar the door already trusts. Version "1"
# matches `model`'s own pin — one graph copy.
blake3 = "1"
# DECIDED (P6-STARLARK, ruling 008): rule predicates are fenced Starlark evaluated
# in-engine via starlark-rust. Version 0.14.2 = latest at land; it is the reference
# Starlark implementation (Meta's, drives Buck2), edition-2024-clean under rustc
# 1.96, and — decisively for the §11.3 load gate — exposes deterministic per-eval
# metering (`set_max_tick_count` = steps, `set_max_heap_size` = mem, both queryable
# post-eval for exact accounting) which the manifest's `EvalBudget{steps,mem}` binds
# to. PACK-level dependency, sealed behind the `rulepack-api@1` pin under
# `CompiledRuleset` — no wire crate may name it (row-13 wire-invariance, grep gate).
# Pin lives at the workspace root (=0.14.2, shared with `rules`) — one graph copy.
starlark = { workspace = true }
# starlark's `#[starlark_module]` builtins return `anyhow::Result`; the injected
# `violation()` fact-API builtin (rulepack-api@1) uses it. Already in the lock via
# starlark's own tree — zero marginal build cost.
anyhow = { workspace = true }
# HOOK (U1.3, the emit leg). A HOOK predicate is written in the EFFECTS rule
# language — `on_change(event)` over the descriptor constructors — not in CHECK's
# `check_change`/`refuse` language. So its load gate is that language's own
# validator (`effects::validate`) and its capability vocabulary is `EffectKind`.
# This is the one edge `policy` takes on `effects`, and it is CAPABILITY-SHAPED:
# HOOK is the advisory leg by charter ("may never veto or mutate"), so the
# correctness gate is not taking a correctness dependency on the advisory kernel —
# it is loading a declaration written in the advisory kernel's language. CHECK's
# own evaluator still mirrors rather than imports (see `check_eval`'s header).
effects = { workspace = true }

[dev-dependencies]
# TEST-ONLY: the §11.1 worked-verdict gate builds a real `model::Document` from the
# frozen wsfix fixture bytes (`model::build(raw, syntax::parse(raw))`) and feeds it to
# `evaluate` — the same pipeline the caller (`fs`/the serving host) runs. `evaluate` itself
# takes pre-built `&Document`s, so `syntax` stays OUT of the production dependency edge
# (`model` is the only production dep); it enters here for tests only.
syntax = { workspace = true }
insta = { workspace = true }
