[package]
name = "transcript"
description = "U5.2 transcript cross-check: a CORROBORATING (never authenticating) detector — cross-checks journal actor claims against the actor's local session JSONL transcript. Strongest verdict is 'corroborated', never 'clean'/'verified' (d3 §3; checklist 13; security F6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The journal actor claims the detector cross-checks: ParsedRow (actor, op, path,
# anchor) recovered from the reserved journal page (U2.1).
receipt = { workspace = true }
# Parse each unauthenticated local JSONL transcript line to find the wire call a
# journal row claims. A non-JSON line simply does not corroborate.
serde_json = { workspace = true }

[dev-dependencies]
# Real on-disk .jsonl transcript fixtures for the three gate scenarios
# (missing / forged-without-line / fabricated) — absence is a real absent file.
tempfile = "3"
