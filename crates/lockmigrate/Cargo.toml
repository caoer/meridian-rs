[package]
name = "lockmigrate"
description = "SELF-RETIRING (U9b, plan decision P4): the ONE quarantined place the v1 `meridian-lock` grammar is spelled in engine Rust. Converts field v1 locks (objects: + `ref:` pins) to R4 v2 (per-pin hash + path/properties selector) through the governed `wire_serve::write::lock_migrate` door — dry-run-first, idempotent, resumable, unknown legacy keys carried verbatim. `crates/lock` deliberately reads v2 ONLY and fails loud on v1; this crate is why it can. It dies once the field sweep is executed and broadcast — its deletion is in U9b's definition of done."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The v2 target shape this crate converts INTO — `lock::Lock`/`PinEntry`/
# `Selector`, and `lock::block_spans` to locate a block without parsing it.
lock = { workspace = true }
# `model::Document` (the parsed page) + the whole-file rev on the CAS guard.
model = { workspace = true }
# Parse the corpus (domain_snapshot, build_corpus) + WorkspaceRoot.
fs = { workspace = true }
# THE governed door: `lock_migrate` lands every per-page rewrite. This crate
# writes no files itself — that is the point of the door.
wire-serve = { workspace = true }
# Wire value types on the door args (Path, NodeRev) + ErrorBody render.
wire = { workspace = true }
# The v1 `ref:` is an agent-plane address; its target/selector split is what
# becomes the v2 `object` + `path`. Parsing it is the address owner's job, never
# a hand-rolled split in a migration tool.
addr = { workspace = true }
# THE RESTORE-POINT PRECONDITION. `git revert` on meridian-rs restores nothing
# — only a pre-sweep commit IN THE VAULT does. `Repo::top_level` is the one-spawn
# probe that says whether such a commit is even possible, so a vault that is not
# a git repo is refused before a single byte moves. A std-only path crate already
# in the workspace; no new external crate enters.
git = { workspace = true }
# MigrationReport serializes to JSON for `mrd lock migrate --json`.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Build Document fixtures in the parser/conversion gates.
syntax = { workspace = true }
# Real on-disk workspaces for the sweep / dry-run / CAS gates.
tempfile = "3"
