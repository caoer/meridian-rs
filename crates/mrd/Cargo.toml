[package]
name = "mrd"
description = "The mrd CLI: wires the workspace / cache / registry foundation into the settled verb surface (init, unregister, resolve, cache ls, cache clean, daemon). Hand-rolled subcommand parsing, no clap; tier-4 ephemeral degrade and Cargo-model last-use auto-GC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# lib + bin: the bin (`main.rs`) is process wiring only; every verb lives in the
# library so integration tests can drive both the real binary (CARGO_BIN_EXE_mrd)
# and the typed entry points.
[lib]
name = "mrd"
path = "src/lib.rs"

[[bin]]
name = "mrd"
path = "src/main.rs"

[dependencies]
# The three landed foundation crates this CLI wires together.
workspace = { workspace = true }
cache = { workspace = true }
registry = { workspace = true }
# The engine-client path (P1, decision 0002 §3): dial the resident daemon over
# its socket, or degrade to an in-process ephemeral engine built from `fs` and
# answered through the shared `wire-serve` read arms — the SAME projection the
# daemon serves, so the two paths never drift. `fs::build_corpus` is U1's
# builder, reused for the degrade; `wire` names the frozen request/response
# shapes. All three are already in the graph via `registry`, so no new external
# crate enters and `cargo deny` is unchanged.
fs = { workspace = true }
wire = { workspace = true }
wire-serve = { workspace = true }
# The corpus-replay harness (`mrd rules replay`): synthesize a ChangeEvent stream
# from a workspace's real history (git commits → consecutive fingerprint diffs)
# or an ordered snapshot fixture, run the effect kernel over it, and report
# dead rules / fire counts / effect-kind distribution / fuel profile. `effects` is
# the eval kernel (0003); `model` + `syntax` build a Document from raw bytes and
# `model::delta::file_delta` derives the per-file change facts. All are path deps
# already in the graph via `fs` — no new external crate, `cargo deny` unchanged.
effects = { workspace = true }
model = { workspace = true }
syntax = { workspace = true }
# The local run plane (U10, verdict ruling 7): `mrd run` mounts `crates/run` —
# §2.1 task addressing, arg/env contracts, deny-by-default caps (U2), and the
# hermetic `--dry` truth through the U5 `evaluate` seam. mrd stays a local
# CLIENT of the engine crates (docs/laws.md charter): never a resident organ,
# never the serve path; run→model is the one reviewable engine edge.
run = { workspace = true }
# The view-organ (V3, design tournament-duckdb/team-a §Q5). `mrd sql` links DuckDB
# client-side: it calls the daemon's `view_path` op, opens the published RO file,
# and for the daemon-absent degrade builds an ephemeral `:memory:` view. mrd calls
# ONLY `view::build_memory` (never `publish` — the daemon is the sole persistent
# writer, OD6); the C2 topology test allows `view -> mrd` (mrd is not a forbidden
# depender). `duckdb` (bundled) is already in the graph via `view`, so no new
# external crate enters and `cargo deny` is unchanged.
view = { workspace = true }
duckdb = { workspace = true }
# JSON output (the house grammar) + the marker body. All already in the graph.
serde = { workspace = true }
serde_json = { workspace = true }
# Foreground-daemon signal handling (SIGINT/SIGTERM → graceful shutdown).
# libc is already a graph dependency (cache depends on it); no new crate enters
# the graph and it passes `cargo deny` unchanged.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# V3 integration gates (crates/mrd/tests/sql_e2e.rs): pre-publish a `view.duckdb`
# (view + fs + cache + workspace) to drive the cold-degrade/STALE/OD8 paths
# without a live daemon, and start an in-process `registry` daemon to drive the
# `view_path` client path. All are path crates already in the graph — no new
# external crate enters, `cargo deny` unchanged.
view = { workspace = true }
fs = { workspace = true }
cache = { workspace = true }
workspace = { workspace = true }
registry = { workspace = true }
model = { workspace = true }
# build three-doc-chain Document fixtures for the U2.3 walk e2e gate: compute
# each page's live rev (model::build ∘ syntax::parse — the SAME parse
# fs::build_corpus runs) so the on-disk `^inputs` pins are byte-correct. A
# dev-only edge; `syntax` is a path crate already in the graph, `cargo deny`
# unchanged.
syntax = { workspace = true }
duckdb = { workspace = true }
