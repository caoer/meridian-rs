[package]
name = "mrd"
description = "The mrd CLI: wires the workspace / cache / registry foundation into the settled verb surface (init, unregister, resolve, cache ls, cache clean, daemon). Hand-rolled subcommand parsing, no clap; tier-4 ephemeral degrade and Cargo-model last-use auto-GC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# lib + bin: the bin (`main.rs`) is process wiring only; every verb lives in the
# library so integration tests can drive both the real binary (CARGO_BIN_EXE_mrd)
# and the typed entry points.
[lib]
name = "mrd"
path = "src/lib.rs"

[[bin]]
name = "mrd"
path = "src/main.rs"

[dependencies]
# The three landed foundation crates this CLI wires together.
workspace = { workspace = true }
cache = { workspace = true }
registry = { workspace = true }
# The engine-client path (P1, decision 0002 §3): dial the resident daemon over
# its socket, or degrade to an in-process ephemeral engine built from `fs` and
# answered through the shared `wire-serve` read arms — the SAME projection the
# daemon serves, so the two paths never drift. `fs::build_corpus` is U1's
# builder, reused for the degrade; `wire` names the frozen request/response
# shapes. All three are already in the graph via `registry`, so no new external
# crate enters and `cargo deny` is unchanged.
fs = { workspace = true }
wire = { workspace = true }
wire-serve = { workspace = true }
# The `mrd test --history` tier (U1.6): reconstruct historical changes by JOINing
# the receipt journal's rows against git (the git-anchor JOIN — the commit that
# appended each `^r-NNNNNN` row gives the write's before/after bytes), build the
# before/after `Document`s through the fixture doc-building path (`syntax::parse` →
# `model::build`), derive the `rulepack-api@2` change, and run the convention's
# `check_change` — the SAME loader/evaluator the door uses. `receipt` parses the
# journal rows; `policy` is the convention loader + `derive_change` + the
# full-`EvalLimits` CHECK evaluator; `model`/`syntax` build the docs. `effects` is
# still the `mrd test`/`mrd run` eval kernel. All are path crates already in the
# graph (`policy`/`receipt` via `wire-serve`) — no new external crate enters,
# `cargo deny` unchanged.
effects = { workspace = true }
model = { workspace = true }
syntax = { workspace = true }
policy = { workspace = true }
receipt = { workspace = true }
# The local run plane (U10, verdict ruling 7): `mrd run` mounts `crates/run` —
# §2.1 task addressing, arg/env contracts, deny-by-default caps (U2), and the
# hermetic `--dry` truth through the U5 `evaluate` seam. mrd stays a local
# CLIENT of the engine crates (docs/laws.md charter): never a resident organ,
# never the serve path; run→model is the one reviewable engine edge.
run = { workspace = true }
# The view-organ (V3, design tournament-duckdb/team-a §Q5). `mrd sql` links DuckDB
# client-side: it calls the daemon's `view_path` op, opens the published RO file,
# and for the daemon-absent degrade builds an ephemeral `:memory:` view. mrd calls
# ONLY `view::build_memory` (never `publish` — the daemon is the sole persistent
# writer, OD6); the C2 topology test allows `view -> mrd` (mrd is not a forbidden
# depender). `duckdb` (bundled) is already in the graph via `view`, so no new
# external crate enters and `cargo deny` is unchanged.
view = { workspace = true }
duckdb = { workspace = true }
# The `mrd test` scenario runner (U1.2): `^put` routes through the PRODUCTION
# write path (`wire-serve` splice/create/remove over a real `fs` mount — no
# in-memory double), and `^expect` runs fenced Starlark under FULL `EvalLimits`
# (tick + heap + call-depth + source-size + nesting). `starlark`/`allocative` are
# already in the graph via `effects`/`policy` (no new external crate enters,
# `cargo deny` unchanged); `effects::validate` supplies the source-size + nesting
# + parse guards so the harness reuses the tested kernel guard, never a fork.
starlark = { workspace = true }
allocative = "0.3"
anyhow = { workspace = true }
# `mrd pin` (U2.4): read a page's inputs: manifest, resolve + compose atomically,
# evaluate check: predicates, and splice the ^inputs lock through the strict
# writer. A local CLIENT of the pin op — `pin` orchestrates model/view/wire-serve
# and is already in the graph via those crates; no new external crate enters.
pin = { workspace = true }
# `mrd attest` (U2.5): attest = realised-gate + pin + receipt. A local CLIENT of
# the attest op — `attest` composes `pin` (already in the graph) and reads the
# realise board for the realised-gate; no new external crate enters.
attest = { workspace = true }
# `mrd new` / `mrd unfold` (U5.3): presets + session birth. A local CLIENT of the
# `preset` op — it loads a def, validates ^properties, and births the scaffold /
# record through the U2.6 guarded create (already in the graph via `wire-serve`);
# no new external crate enters.
preset = { workspace = true }
# `mrd check` (U2.10): the pure READ validity verb. A local CLIENT of the `check`
# engine — layer 0 recomputes the receipt journal's chain continuity and the
# foreign_edit trace over the resolved workspace. `check` composes receipt / fs /
# realise / policy, already in the graph; no new external crate enters.
check = { workspace = true }
# `mrd realise` (U3.5b): the reconciliation-loop verb. A local CLIENT of the
# `realise` engine (U3.5a) — observe → check → apply (rides `run`) → re-check,
# the A4 classifier, the pending-agent board mint. Already in the graph via
# `check`; no new external crate enters.
realise = { workspace = true }
# JSON output (the house grammar) + the marker body. All already in the graph.
serde = { workspace = true }
serde_json = { workspace = true }
# The `mrd test` scenario runner mounts each scenario's `base/` into a REAL
# tmpdir (fidelity — the production write path lands actual bytes). `tempfile` is
# already a graph dependency (dev-deps + other crates); no new external crate.
tempfile = "3"
# Foreground-daemon signal handling (SIGINT/SIGTERM → graceful shutdown).
# libc is already a graph dependency (cache depends on it); no new crate enters
# the graph and it passes `cargo deny` unchanged.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# V3 integration gates (crates/mrd/tests/sql_e2e.rs): pre-publish a `view.duckdb`
# (view + fs + cache + workspace) to drive the cold-degrade/STALE/OD8 paths
# without a live daemon, and start an in-process `registry` daemon to drive the
# `view_path` client path. All are path crates already in the graph — no new
# external crate enters, `cargo deny` unchanged.
view = { workspace = true }
fs = { workspace = true }
cache = { workspace = true }
workspace = { workspace = true }
registry = { workspace = true }
model = { workspace = true }
# build three-doc-chain Document fixtures for the U2.3 walk e2e gate: compute
# each page's live rev (model::build ∘ syntax::parse — the SAME parse
# fs::build_corpus runs) so the on-disk `^inputs` pins are byte-correct. A
# dev-only edge; `syntax` is a path crate already in the graph, `cargo deny`
# unchanged.
syntax = { workspace = true }
duckdb = { workspace = true }
# The U1.6 `test --history` gate (crates/mrd/tests/history.rs) drives the tier over
# the REAL embedded seed convention: `policy::seed_convention_files()` supplies the
# exact `reviewer-not-owner` CHECK bytes the test writes into the workspace's
# convention folder, so the gate exercises the shipped law, never a hand-copied
# rule. `policy` is a path crate already in the graph — no new external crate.
policy = { workspace = true }
