[package]
name = "transport"
description = "Untyped NDJSON message envelope + codec seam (lsp-server pattern): knows framing, never meaning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# raw_value: the B2 id-scan reads the VERBATIM `id` lexeme before typed decode
# (contract §3.1) — `RawValue` preserves `3e0`/`"7"`/`2^64` byte-for-byte where
# a parsed `Value` would normalize or overflow them.
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
# lsp-server keeps lsp-types as a dev-dependency only; same discipline here —
# wire types appear in tests to prove typed/untyped agreement, never in the lib.
wire = { workspace = true }
